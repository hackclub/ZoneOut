<script>
// theme, read before the first paint
try {
    var zoTheme = localStorage.getItem("zoneoutTheme");
    if (zoTheme && zoTheme !== "default" && /^[a-z0-9-]{1,24}$/.test(zoTheme)) {
        document.documentElement.setAttribute("data-theme", zoTheme);
        var zoMeta = document.querySelector('meta[name="theme-color"]');
        if (zoMeta) zoMeta.content = { bw: "#0a0a0a", fnaf: "#000000", halloween: "#080402" }[zoTheme] || "#000000";
    }
} catch (e) {}
</script>
<title>ZoneOut Terminal</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>
// session hint, read before the first paint
document.documentElement.classList.toggle(
    "knownSession",
    /(?:^|;\s*)(?:__Host-)?zo_hint=1(?:\s*;|$)/.test(document.cookie)
);

try {
    if (sessionStorage.getItem("zoneoutFadeIn")) {
        sessionStorage.removeItem("zoneoutFadeIn");
        document.documentElement.classList.add("fadeIn");

        setTimeout(function () {
            document.documentElement.classList.remove("fadeIn");
        }, 1200);
    }
} catch (e) {
}

// the slowest request, started in the head
window.__mePromise = fetch("/api/auth/me", { credentials: "same-origin" });
window.__mePromise.catch(function () {  });

// this tab's last project list
window.__projectCache = null;
try {
    var cached = sessionStorage.getItem("zoneoutProjects");
    if (cached) window.__projectCache = JSON.parse(cached);
} catch (e) {  }
</script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Courier New",monospace;
}

body{
background:rgb(var(--bg));
color:rgb(var(--fg));
overflow-x:hidden;
min-height:100vh;

min-height:100dvh;
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

/* BACKDROP */
.videoBG{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
min-width:100%;
min-height:100%;
object-fit:cover;
transform:translate(-50%,-50%);
z-index:-2;
pointer-events:none;
}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at center, rgba(var(--bg),0.1), rgba(var(--bg),0.92));
z-index:-1;
}

body.onError .videoBG,
body.onError .overlay{
display:none;
}

/* BACK CONTROL */
.backBtn{
display:block;
position:fixed;
top:20px;
left:20px;
cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M2%2014s5-7%2012-7%2012%207%2012%207-5%207-12%207S2%2014%202%2014z'%20fill='%23000000'%20stroke='%23ffffff'%20stroke-width='1.6'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='4.8'%20fill='%23ffffff'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='1.7'%20fill='%23000000'/%3E%3C/svg%3E") 14 14, pointer;
font-size:16px;
opacity:0.7;
transition:0.2s;
z-index:80;
color:rgb(var(--fg));
}

.backBtn:hover,
.backBtn:focus-visible{
opacity:1;
outline:none;
text-shadow:0 0 6px rgb(var(--fg));
}

/* VIEWS */
.state{
display:none;
}

.state.show{
display:block;
}

.loadingScreen{
z-index:90;
}

html.fadeIn .screenVeil{
opacity:1;
}

/* CAMERA MAP */
.camMap{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:min(900px,92vw);
height:clamp(380px,68vh,600px);
z-index:2;
}

#wireSparks{
position:fixed;
inset:0;
z-index:1;
pointer-events:none;
}

/* TOUCH AND SMALL SCREENS */
@media (pointer: coarse){
.camNode{
min-height:48px;
}

.backBtn{
padding:12px 16px;
margin:-12px -16px;
}
}

@media (hover: none){
.backBtn:hover,
.camNode:hover{
transform:none;
}
}

.backBtn{
top:max(20px, calc(env(safe-area-inset-top) + 12px));
left:max(20px, calc(env(safe-area-inset-left) + 14px));
}

.volumeDock{
right:max(16px, calc(env(safe-area-inset-right) + 12px));
bottom:max(16px, calc(env(safe-area-inset-bottom) + 12px));
}

@media (max-width: 560px){
.volumeDock{
gap:8px;
padding:8px 10px;
font-size:12px;
}

.volumeDock input[type="range"]{
width:96px;
}

.volumeDock span{
min-width:34px;
}
}

@media (max-width: 400px){
.volumeDock label{
display:none;
}

.volumeDock input[type="range"]{
width:88px;
}
}

/* SCROLL AND VEIL */
body.noScroll{
overflow:hidden;
}

.screenVeil.quick{
transition-duration:.16s;
}

/* THE WIRES */
.camLines{
position:absolute;
inset:0;
width:100%;
height:100%;
pointer-events:none;
}

.camLines polyline{
fill:none;
vector-effect:non-scaling-stroke;
}

.camLines .wireBase{
stroke:rgba(var(--fg),0.45);
stroke-width:1.5;
}

.camLines .wirePulse{
stroke:rgb(var(--fg));
stroke-width:2.8;
stroke-linecap:round;
stroke-dasharray:60 940;
filter:drop-shadow(0 0 6px rgb(var(--fg))) drop-shadow(0 0 16px rgba(var(--fg),0.85));
animation:wirePulse 3.4s linear infinite;
}

@keyframes wirePulse{
from{stroke-dashoffset:0;}
to{stroke-dashoffset:1000;}
}

.camMap .camNode{
position:absolute;
transform:translate(-50%,-50%);
}

@media (max-width:720px){
.camMap{
height:auto;
display:flex;
flex-direction:column;
align-items:center;

gap:24px;
}

.camMap::before{
content:"";
position:absolute;

top:0;
bottom:0;
left:50%;

transform:translateX(-50%);
width:2px;

z-index:-1;
background:linear-gradient(to top,
rgba(var(--fg),0.42) 0%,
rgba(var(--fg),0.42) 44%,
rgb(var(--fg)) 50%,
rgba(var(--fg),0.42) 56%,
rgba(var(--fg),0.42) 100%);

box-shadow:0 0 7px rgba(var(--fg),0.5);
animation:wireScroll 3.4s linear infinite;
}

@keyframes wireScroll{
from{background-position:50% 100%;}
to{background-position:50% 0%;}
}

.camLines{
display:none;
}

.camMap .camNode{
position:static;
transform:none;

width:min(240px, 68vw);
padding:13px 10px;
letter-spacing:3px;
}

</style>

<script>

// timings
const VEIL_MS = 450;
const DOTS_MS = 10000;

// elements
const loadingScreen = document.getElementById("loadingScreen");
const loadingText = document.getElementById("loadingText");
const screenVeil = document.getElementById("screenVeil");
const camMap = document.getElementById("camMap");
const toast = document.getElementById("toast");
const backBtn = document.getElementById("backBtn");

const knownSession = document.documentElement.classList.contains("knownSession");

// views of this one document
const VIEWS = {
    "/home":     { state: "stateIn",    page: null },
    "/submit":   { state: "stateIn",    page: "pageSubmit" },
    "/projects": { state: "stateIn",    page: "pageProjects" },
    "/profile":  { state: "stateIn",    page: "pageProfile" },
    "/error":    { state: "stateError", page: null }
};

function pathOf(pathname) {
    const path = pathname.replace(/\/+$/, "") || "/home";
    return VIEWS[path] ? path : "/home";
}

let currentPath = null;
let pushedHere = false;
let lastInputWasKeyboard = false;

// rendering
function render(path) {
    currentPath = path;
    const view = VIEWS[path];

    document.querySelectorAll(".state").forEach(s => s.classList.remove("show"));
    document.querySelectorAll(".subPage").forEach(p => p.classList.remove("show"));

    document.getElementById(view.state).classList.add("show");
    camMap.style.display = view.page ? "none" : "";
    if (view.page) document.getElementById(view.page).classList.add("show");

    document.body.classList.toggle("onError", path === "/error");

    document.documentElement.dataset.gear =
        (path === "/home" || path === "/projects" || path === "/profile") ? "on" : "off";

    document.body.classList.toggle("noScroll", path === "/home" || path === "/error");

    if (path === "/submit") mountForm();
    if (path === "/projects") loadProjects();
    if (path === "/error") startDots(); else stopDots();
    if (path === "/home") startSparks(); else stopSparks();
    if (path === "/home") maybePromptHackatime();

    const first = document.querySelector(".state.show .camNode, .state.show .projCard");
    if (first && lastInputWasKeyboard) first.focus();

    window.scrollTo(0, 0);
}

// transitions
const FADE_MS = 160;
let fadeTimer = null;

function transition(swap) {
    clearTimeout(fadeTimer);
    screenVeil.classList.add("quick", "on");

    fadeTimer = setTimeout(() => {
        swap();
        screenVeil.classList.remove("on");
        fadeTimer = setTimeout(() => screenVeil.classList.remove("quick"), FADE_MS);
    }, FADE_MS);
}

function leaveTo(href) {
    try { sessionStorage.setItem("zoneoutFadeIn", "1"); } catch (e) {  }
    screenVeil.classList.remove("quick");
    screenVeil.classList.add("on");
    setTimeout(() => { window.location.href = href; }, VEIL_MS);
}

function fadeUp() {
    const root = document.documentElement;
    requestAnimationFrame(() => root.classList.remove("fadeIn"));
    setTimeout(() => root.classList.remove("fadeIn"), 80);
    screenVeil.classList.remove("on");
}

fadeUp();

window.addEventListener("pageshow", (e) => {
    if (!e.persisted) return;
    fadeUp();

    if (currentPath === "/projects") {
        try {
            const cached = JSON.parse(sessionStorage.getItem("zoneoutProjects") || "null");
            if (cached && Array.isArray(cached.list) && cached.userId === currentUserId) {
                window.__projectCache = cached;
                renderProjects(cached.list);
            }
        } catch (err) {  }

        loadProjects({ force: true });
    }
});

// navigation
function go(path) {
    if (path === currentPath) return;
    history.pushState({ path }, "", path);
    pushedHere = true;
    transition(() => render(path));
}

function leaveSubPage() {
    if (pushedHere) {
        history.back();
        return;
    }
    history.replaceState({ path: "/home" }, "", "/home");
    transition(() => render("/home"));
}

// audio
const bgAudio = document.getElementById("bgAudio");
const FADE_IN_MS = 1600;

let masterVolume = 0.35;
try {
    const saved = Number(localStorage.getItem("zoneoutVolume"));
    if (Number.isFinite(saved) && saved >= 0 && saved <= 100
        && localStorage.getItem("zoneoutVolume") !== null) {
        masterVolume = saved / 100;
    }
} catch (e) {}

const clampVolume = level => Math.min(Math.max(level, 0), 1);

let fadeGeneration = 0;

function fadeInAudio() {
    const mine = ++fadeGeneration;
    const start = performance.now();

    function step(now) {
        if (mine !== fadeGeneration) return;
        const progress = Math.min((now - start) / FADE_IN_MS, 1);
        bgAudio.volume = clampVolume(masterVolume * progress);
        if (progress < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
    setTimeout(() => {
        if (mine === fadeGeneration) bgAudio.volume = clampVolume(masterVolume);
    }, FADE_IN_MS + 250);
}

// click sound
const uiClick = document.getElementById("uiClick");

function playClick() {
    uiClick.currentTime = 0;
    uiClick.volume = clampVolume(masterVolume * 0.35);
    uiClick.play().catch(() => {});
}

syncVolumeDisplay();

volumeSlider.addEventListener("input", () => {
    masterVolume = Number(volumeSlider.value) / 100;
    try { localStorage.setItem("zoneoutVolume", volumeSlider.value); } catch (e) {}

    fadeGeneration++;
    bgAudio.volume = clampVolume(masterVolume);
    syncVolumeDisplay();

    resumeAudio();
});

function resumeAudio() {
    if (!bgAudio.paused || masterVolume === 0) return;
    bgAudio.volume = 0;
    bgAudio.play().then(fadeInAudio).catch(() => {});
}

resumeAudio();
bgAudio.addEventListener("canplay", resumeAudio);

// wire sparks
const sparkCanvas = document.getElementById("wireSparks");
const wirePulse = document.querySelector(".camLines .wirePulse");
const PULSE_DASH = 60;
const PULSE_UNITS = 1000;
const MAX_SPARKS = 120;
let sparks = [];
let sparkFrame = null;
let nextSpark = 0;

function sizeSparks() {
    sparkCanvas.width = window.innerWidth;
    sparkCanvas.height = window.innerHeight;
}

function pulseHead() {
    if (!wirePulse.getScreenCTM) return null;

    const ctm = wirePulse.getScreenCTM();
    if (!ctm) return null;

    const offset = parseFloat(getComputedStyle(wirePulse).strokeDashoffset) || 0;
    const centre = (((PULSE_DASH - offset) % PULSE_UNITS) + PULSE_UNITS) % PULSE_UNITS;
    const at = wirePulse.getPointAtLength(centre / PULSE_UNITS * wirePulse.getTotalLength());

    return at.matrixTransform(ctm);
}

function startSparks() {
    if (sparkFrame) return;
    sizeSparks();

    const ctx = sparkCanvas.getContext("2d");

    function step(now) {
        ctx.clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);

        if (now >= nextSpark) {
            nextSpark = now + 90 + Math.random() * 320;
            const head = pulseHead();

            if (head) {
                const burst = Math.min(1 + Math.floor(Math.random() * 3),
                                       MAX_SPARKS - sparks.length);
                for (let i = 0; i < burst; i++) {
                    sparks.push({
                        x: head.x,
                        y: head.y,
                        vx: (Math.random() - 0.5) * 0.9,
                        vy: (Math.random() - 0.5) * 0.9 - 0.25,
                        life: 0,
                        span: 520 + Math.random() * 620,
                        size: 0.8 + Math.random() * 1.6,
                        last: now
                    });
                }
            }
        }

        ctx.fillStyle = "#fff";
        ctx.shadowColor = "rgba(255,255,255,0.9)";
        ctx.shadowBlur = 6;

        let live = 0;
        for (let i = 0; i < sparks.length; i++) {
            const s = sparks[i];
            const dt = now - s.last;
            s.last = now;
            s.life += dt;
            if (s.life >= s.span) continue;

            s.x += s.vx * dt * 0.06;
            s.y += s.vy * dt * 0.06;

            const fade = 1 - s.life / s.span;
            ctx.globalAlpha = fade;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size * fade, 0, Math.PI * 2);
            ctx.fill();

            sparks[live++] = s;
        }
        sparks.length = live;

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        sparkFrame = requestAnimationFrame(step);
    }

    sparkFrame = requestAnimationFrame(step);
}

function stopSparks() {
    if (sparkFrame) cancelAnimationFrame(sparkFrame);
    sparkFrame = null;
    sparks = [];
    sparkCanvas.getContext("2d").clearRect(0, 0, sparkCanvas.width, sparkCanvas.height);
}

// the /error dot field
const dotsCanvas = document.getElementById("errorDots");
let dotsFrame = null;
let dotsTimer = null;
let dotsStart = 0;

function sizeDots() {
    dotsCanvas.width = window.innerWidth;
    dotsCanvas.height = window.innerHeight;
}

function startDots() {
    if (dotsFrame) return;

    sizeDots();
    const ctx = dotsCanvas.getContext("2d");
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, dotsCanvas.width, dotsCanvas.height);
    dotsStart = performance.now();

    function step(now) {
        const progress = Math.min((now - dotsStart) / DOTS_MS, 1);

        const count = Math.round(4 + progress * progress * 900);
        ctx.fillStyle = "#fff";

        for (let i = 0; i < count; i++) {
            const x = Math.random() * dotsCanvas.width;
            const y = Math.random() * dotsCanvas.height;
            const r = 1 + Math.random() * (1 + progress * 4);
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();
        }

        if (progress < 1) {
            dotsFrame = requestAnimationFrame(step);
        } else {
            dotsFrame = null;
            window.location.href = "/";
        }
    }

    dotsFrame = requestAnimationFrame(step);

    clearTimeout(dotsTimer);
    dotsTimer = setTimeout(() => { window.location.href = "/"; }, DOTS_MS + 400);
}

function stopDots() {
    if (dotsFrame) cancelAnimationFrame(dotsFrame);
    dotsFrame = null;
    clearTimeout(dotsTimer);
    dotsTimer = null;
}

// projects
const projGrid = document.getElementById("projGrid");
const projEmpty = document.getElementById("projEmpty");
const newProjectBtn = document.getElementById("newProjectBtn");

let meSettled = false;
let projectsFresh = false;
let projectsInFlight = null;
let currentUserId = null;
let currentUserName = null;

function stashProjects(userId, list) {
    const cache = { userId, userName: currentUserName, list };
    window.__projectCache = cache;
    try {
        sessionStorage.setItem("zoneoutProjects", JSON.stringify(cache));
    } catch (e) {  }
}

function forgetProjects() {
    window.__projectCache = null;
    try { sessionStorage.removeItem("zoneoutProjects"); } catch (e) {}
}

function adoptProjects(userId, userName, list) {
    meSettled = true;
    currentUserId = userId ?? null;
    currentUserName = userName ?? null;
    if (!Array.isArray(list)) return;

    stashProjects(currentUserId, list);
    projectsFresh = true;

    if (currentPath === "/projects") {
        projectsFresh = false;
        renderProjects(list);
    }
}

function loadProjects({ force = false } = {}) {
    if (renderedSignature === null) {
        const cache = window.__projectCache;

        if (cache && Array.isArray(cache.list) &&
            (currentUserId === null || cache.userId === currentUserId)) {
            renderProjects(cache.list);
        } else {
            projEmpty.textContent = "Loading\u2026";
        }
    }

    if (force) return revalidateProjects();

    if (!meSettled) return;

    if (projectsFresh) {
        projectsFresh = false;
        return;
    }

    revalidateProjects();
}

function revalidateProjects() {
    if (projectsInFlight) return projectsInFlight;

    projectsInFlight = fetch("/api/projects", { credentials: "same-origin" })
        .then(response => {
            if (response.status === 403) { window.location.replace("/ban"); return null; }
            if (!response.ok) throw new Error("could not load");
            return response.json();
        })
        .then(payload => {
            if (!payload) return;
            projectsFresh = false;
            stashProjects(currentUserId, payload.projects || []);
            renderProjects(payload.projects);
        })
        .catch(() => {
            if (renderedSignature === null) {
                projEmpty.textContent = "Could not load your projects.";
            }
        })
        .finally(() => { projectsInFlight = null; });

    return projectsInFlight;
}

// project grid
let renderedSignature = null;
let currentList = [];

function renderProjects(projects) {
    const list = Array.isArray(projects) ? projects : [];

    const signature = JSON.stringify(list);
    if (signature === renderedSignature) return;
    renderedSignature = signature;
    currentList = list;

    Array.from(projGrid.querySelectorAll(".projCard:not(.plusCard)")).forEach(el => el.remove());

    const batch = document.createDocumentFragment();
    const thumbs = list.map(project => {
        const card = projectCard(project);
        batch.appendChild(card);
        return card.firstChild;
    });
    batch.appendChild(newProjectBtn);
    projGrid.appendChild(batch);

    const boxWidth = thumbBoxWidth();
    thumbs.forEach((thumb, i) => {
        thumb.style.fontSize = thumbFontSize(list[i].name, boxWidth) + "px";
    });

    projEmpty.textContent = list.length ? "" : "No projects yet. Press + to make your first.";
}

function projectCard(project) {
    const card = document.createElement("a");
    card.className = "projCard";
    card.href = "/projects/" + project.projectId;

    const thumb = document.createElement("div");
    thumb.className = "projThumb";
    thumb.textContent = project.name;
    card.appendChild(thumb);

    const name = document.createElement("div");
    name.className = "projName";
    name.textContent = project.name;
    card.appendChild(name);

    const meta = document.createElement("div");
    meta.className = "projMeta";
    meta.textContent = "#" + project.projectId;
    card.appendChild(meta);

    return card;
}

function thumbBoxWidth() {
    const sample = projGrid.querySelector(".projThumb") || newProjectBtn;
    const width = sample.getBoundingClientRect().width;

    return (width > 40 ? width : 190) - 24;
}

function thumbFontSize(name, boxPx) {
    const text = (name || "").trim();
    const length = text.length;

    let byLines = 13;
    if (length <= 4) byLines = 38;
    else if (length <= 8) byLines = 30;
    else if (length <= 14) byLines = 23;
    else if (length <= 24) byLines = 18;
    else if (length <= 40) byLines = 15;

    const longest = text.split(/\s+/).reduce((max, word) => Math.max(max, word.length), 1);
    const byWidth = Math.floor(boxPx / (longest * 0.6 + 1));

    return Math.max(10, Math.min(byLines, byWidth));
}

// create-project dialog
const projModal = document.getElementById("projModal");
const projForm = document.getElementById("projForm");
const projError = document.getElementById("projError");
const projSubmit = document.getElementById("projSubmit");

let projReturnFocus = null;

function projModalOpen() {
    return projModal.classList.contains("show");
}

function openProjectModal() {
    projReturnFocus = document.activeElement;

    projForm.reset();
    setHtChoice(null);
    projError.textContent = "";
    projSubmit.disabled = false;
    projSubmit.textContent = "CREATE PROJECT";

    projModal.hidden = false;

    requestAnimationFrame(() => projModal.classList.add("show"));

    document.body.classList.add("noScroll");
    setInertBehind(true, projModal);

    loadHackatimeProjects();
    projNameInput.focus();
}

function closeProjectModal() {
    projModal.classList.remove("show");
    closeHtMenu(false);
    setInertBehind(false, projModal);
    restoreScroll();

    setTimeout(() => { if (!projModalOpen()) projModal.hidden = true; }, 240);

    if (projReturnFocus && document.contains(projReturnFocus)) projReturnFocus.focus();
    projReturnFocus = null;
}

function setInertBehind(on, dialog) {
    Array.from(document.body.children).forEach(child => {
        if (child !== dialog && child.tagName !== "SCRIPT") child.inert = on;
    });
}

function anyModalOpen() {
    return projModalOpen() || htModalOpen();
}

function restoreScroll() {
    if (anyModalOpen()) return;
    document.body.classList.toggle("noScroll", currentPath === "/home" || currentPath === "/error");
}

document.getElementById("projModalClose").addEventListener("click", closeProjectModal);

projModal.addEventListener("mousedown", (e) => {
    if (e.target === projModal) closeProjectModal();
});

projForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const body = {
        name: projNameInput.value,
        description: document.getElementById("projDescription").value,
        repoUrl: document.getElementById("projRepo").value,
        demoUrl: document.getElementById("projDemo").value,
        hackatimeProject: htChoice
    };

    if (!body.name.trim() || !body.description.trim()) {
        projError.textContent = "A project needs a name and a description.";
        return;
    }

    projError.textContent = "";
    projSubmit.disabled = true;
    projSubmit.textContent = "CREATING\u2026";

    fetch("/api/projects", {
        method: "POST",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    })
        .then(response => {
            if (response.status === 403) { window.location.replace("/ban"); return null; }
            return response.json().then(payload => ({ ok: response.ok, payload }));
        })
        .then(result => {
            if (!result) return;
            if (!result.ok) {
                projError.textContent = result.payload.error || "Could not create the project.";
                projSubmit.disabled = false;
                projSubmit.textContent = "CREATE PROJECT";
                return;
            }
            closeProjectModal();

            if (result.payload.project) {
                claimHtProject(result.payload.project);
                renderProjects([result.payload.project].concat(currentList));
            }
            loadProjects({ force: true });
            showToast("Project created.");
        })
        .catch(() => {
            projError.textContent = "Could not reach ZoneOut.";
            projSubmit.disabled = false;
            projSubmit.textContent = "CREATE PROJECT";
        });
});

function buildHtMenu() {
    projHtMenu.replaceChildren();

    const entries = [{ name: null, hours: null }].concat(htList || []);

    entries.forEach(entry => {
        const option = document.createElement("button");
        option.className = "htOption";
        option.type = "button";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", String((entry.name || null) === htChoice));
        option.textContent = entry.name || NO_LINK_LABEL;

        if (entry.name) {
            const hours = document.createElement("span");
            hours.className = "htHours";
            hours.textContent = "  " + entry.hours + "h";
            option.appendChild(hours);
        }

        // one hackatime project belongs to one zoneout project

            taken.className = "htTaken";
            taken.textContent = "  (linked to different project)";
            option.appendChild(taken);
            option.disabled = true;

            option.addEventListener("click", () => {
                setHtChoice(entry.name);
                closeHtMenu(true);
            });
        }

        projHtMenu.appendChild(option);
    });
}

// the cached list would otherwise still offer the name this project just took

    if (!created.hackatimeProject || !htList) return;

    const entry = htList.find(item => item.name.toLowerCase() === created.hackatimeProject.toLowerCase());
    if (entry) entry.linkedTo = { projectId: created.projectId, name: created.name };
}

    projHtMenu.hidden = true;
    projHtBtn.setAttribute("aria-expanded", "false");

// fetched on first use, so a visitor who never creates a project never pays for it
function loadHackatimeProjects() {
    if (!hackatimeLinked) {
        showHtNote("Your Hackatime account is not connected.", true);
        return;
    }

    showHtPicker();
    if (htList || htListPending) return;

    htListPending = fetch("/api/hackatime/projects", { credentials: "same-origin" })
        .then(response => response.ok ? response.json() : null)
        .then(payload => {
            htListPending = null;
            if (!payload || !payload.ok) return;

            if (!payload.linked) {
                hackatimeLinked = false;
                showHtNote("Your Hackatime account is not connected.", true);
                return;
            }

            htList = payload.projects || [];
            if (!htList.length) {
                showHtNote("No Hackatime projects have time logged since the event started.", false);
                return;
            }
            if (!projHtMenu.hidden) buildHtMenu();
        })
        .catch(() => { htListPending = null; });
}

// the periodic refresh
function syncHackatime() {
    if (!hackatimeLinked) return;

    fetch("/api/hackatime/sync", { method: "POST", credentials: "same-origin" })
        .then(response => response.ok ? response.json() : null)
        .then(payload => {
            if (!payload || !payload.ok || !payload.projects || !payload.projects.length) return;
            applyHours(payload.projects);
        })
        .catch(() => {  });
}

function applyHours(rows) {
    // the stash is authoritative; currentList is empty until the board has been drawn once
    const cache = window.__projectCache;
    const source = cache && Array.isArray(cache.list) ? cache.list : null;
    if (!source || !source.length) return;

    const hours = new Map(rows.map(row => [row.projectId, row.hackatimeHours]));

    const merged = source.map(project => (
        hours.has(project.projectId)
            ? Object.assign({}, project, { hackatimeHours: hours.get(project.projectId) })
            : project
    ));

    stashProjects(currentUserId, merged);
    if (currentPath === "/projects") renderProjects(merged);
}

        .then(response => {
            button.disabled = false;
            if (!response.ok) { showToast("Could not unlink Hackatime."); return; }

            hackatimeLinked = false;
            htList = null;
            paintHackatime();
            showToast("Hackatime disconnected.");
        })
        .catch(() => {
            button.disabled = false;
            showToast("Could not reach ZoneOut.");
        });
});

// the message the callback leaves behind
function flushHackatimeNotice() {
    const params = new URLSearchParams(location.search);
    const code = params.get("ht");
    if (!code) return;

    params.delete("ht");
    const query = params.toString();
    history.replaceState(history.state, "", location.pathname + (query ? "?" + query : ""));

    const messages = {
        linked: "Hackatime connected.",
        denied: "Hackatime was not connected.",
        state: "That link expired. Try again.",
        failed: "Hackatime could not be reached."
    };
    showToast(messages[code] || "Hackatime could not be reached.");
}

// keyboard
function focusables() {
    const list = Array.from(document.querySelectorAll(".state.show .camNode, .state.show .projCard"))
                      .concat([backBtn]);

    const gear = document.getElementById("settingsGear");
    if (gear && document.documentElement.getAttribute("data-gear") === "on") list.push(gear);

    return list.filter(el => el && !el.disabled && el.getClientRects().length > 0);
}

function dialogControls(dialog) {
    return Array.from(dialog.querySelectorAll("button, a[href]"))
                .filter(el => !el.disabled && el.getClientRects().length > 0);
}

function stepThrough(items, delta) {
    if (!items.length) return;

    const at = items.indexOf(document.activeElement);
    const next = at === -1
        ? (delta > 0 ? 0 : items.length - 1)
        : (at + delta + items.length) % items.length;

    items[next].focus();
}

function jumpTo(items, last) {
    if (!items.length) return;
    items[last ? items.length - 1 : 0].focus();
}

document.addEventListener("keydown", (e) => {
    if (window.zoneoutSettings && window.zoneoutSettings.isOpen()) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;

    const step = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 }[e.key];

    if (!projHtMenu.hidden) {
        if (e.key === "Escape") {
            e.preventDefault();
            closeHtMenu(true);
        } else if (step) {
            e.preventDefault();
            stepThrough(Array.from(projHtMenu.children).filter(el => !el.disabled), step);
        } else if (e.key === "Home" || e.key === "End") {
            e.preventDefault();
            jumpTo(Array.from(projHtMenu.children).filter(el => !el.disabled), e.key === "End");
        }
        return;
    }

    if (anyModalOpen()) {
        if (e.key === "Escape") {
            e.preventDefault();
            if (projModalOpen()) closeProjectModal();
            else closeHtModal();
            return;
        }

        const editing = document.activeElement;
        if (editing === projHtBtn && step) {
            e.preventDefault();
            openHtMenu();
            return;
        }

        if (editing && (editing.tagName === "INPUT" || editing.tagName === "TEXTAREA")) return;

        const dialog = projModalOpen() ? projModal : htModal;

        if (step) {
            e.preventDefault();
            stepThrough(dialogControls(dialog), step);
        } else if (e.key === "Home" || e.key === "End") {
            e.preventDefault();
            jumpTo(dialogControls(dialog), e.key === "End");
        }
        return;
    }

    if (e.key === "Escape") {
        e.preventDefault();
        goBack();
        return;
    }

    const editing = document.activeElement;
    if (editing && (editing.tagName === "INPUT" || editing.tagName === "TEXTAREA")) return;

    if (step) {
        e.preventDefault();
        stepThrough(focusables(), step);
    } else if (e.key === "Home" || e.key === "End") {
        e.preventDefault();
        jumpTo(focusables(), e.key === "End");
    }
});

// log out
function forgetSessionHint() {
    const attrs = "Max-Age=0; Path=/; SameSite=Lax";
    document.cookie = `zo_hint=; ${attrs}`;
    if (location.protocol === "https:") {
        document.cookie = `__Host-zo_hint=; ${attrs}; Secure`;
    }
}

document.getElementById("logoutBtn").addEventListener("click", async () => {
    try {
        await fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" });
    } catch {
    }

    forgetSessionHint();

    forgetProjects();

    try { sessionStorage.setItem("zoneoutFadeIn", "1"); } catch (e) {}
    screenVeil.classList.add("on");
    setTimeout(() => { window.location.href = "/"; }, VEIL_MS);
});

// profile fields
const put = (id, value) => { document.getElementById(id).textContent = value; };

function toError(message) {
    document.getElementById("errMessage").textContent = message;
    history.replaceState({ path: "/error" }, "", "/error");
    pushedHere = false;

    if (currentPath === null) render("/error");
    else transition(() => render("/error"));
}

// session load
async function load() {
    let response;
    try {
        response = await window.__mePromise;
    } catch {
        stopLoading();
        return toError("The terminal could not reach ZoneOut.");
    }

    if (response.status === 401) {
        stopLoading();
        forgetProjects();
        return toError("You need to first log in!");
    }

    if (response.status === 403) {
        window.location.replace("/ban");
        return;
    }

    if (!response.ok) {
        stopLoading();
        return toError("The terminal could not reach ZoneOut.");
    }

    let payload;
    try {
        payload = await response.json();
    } catch {
        stopLoading();
        return toError("The terminal could not reach ZoneOut.");
    }

    const user = payload.user;
    put("fName", user.name || "—");
    put("fEmail", user.email);
    put("fSlack", user.slackId || "not linked");

    hackatimeLinked = Boolean(user.hackatimeLinked);
    htKnown = true;
    paintHackatime();

    adoptProjects(user.userId, user.name, payload.projects);

    stopLoading();
    if (currentPath === null) render(pathOf(location.pathname));

    flushHackatimeNotice();
    syncHackatime();
    maybePromptHackatime();
}

// entry
const entryPath = pathOf(location.pathname);
history.replaceState({ path: entryPath }, "", entryPath);

if (knownSession || entryPath === "/error") render(entryPath);

load();

// nothing decodes for a hidden tab
const videoBG = document.getElementById("videoBG");

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") videoBG.play().catch(() => {});
    else videoBG.pause();
});
</script>
