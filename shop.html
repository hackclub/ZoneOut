// fade up from the black the previous page left on
try {
    if (sessionStorage.getItem("zoneoutFadeIn")) {
        sessionStorage.removeItem("zoneoutFadeIn");
        document.documentElement.classList.add("fadeIn");

        setTimeout(function () {
            document.documentElement.classList.remove("fadeIn");

}

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Courier New",monospace;
}

body{
background:black;
color:white;
overflow-x:hidden;
min-height:100vh;
min-height:100dvh;
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

/* BACKDROP */
.videoBG{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
min-width:100%;
min-height:100%;
object-fit:cover;
transform:translate(-50%,-50%);
filter:brightness(0.25) contrast(1.2);
z-index:-2;
pointer-events:none;
}

html.fadeIn .screenVeil{
opacity:1;
}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at top, rgba(70,0,120,0.3), black 70%);
z-index:-1;
pointer-events:none;
}

/* BACK CONTROL */
.backBtn{
display:block;
position:fixed;
top:max(20px, calc(env(safe-area-inset-top) + 12px));
left:max(20px, calc(env(safe-area-inset-left) + 14px));
cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M2%2014s5-7%2012-7%2012%207%2012%207-5%207-12%207S2%2014%202%2014z'%20fill='%23000000'%20stroke='%23ffffff'%20stroke-width='1.6'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='4.8'%20fill='%23ffffff'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='1.7'%20fill='%23000000'/%3E%3C/svg%3E") 14 14, pointer;
font-size:16px;
opacity:0.7;
transition:0.2s;
z-index:50;
color:white;
}

.backBtn[hidden]{
display:none;
}

.backBtn:hover,
.backBtn:focus-visible{
opacity:1;
outline:none;
text-shadow:0 0 6px white;
}

/* BALANCE */
.balanceDock{
position:fixed;
top:max(20px, calc(env(safe-area-inset-top) + 12px));
right:max(20px, calc(env(safe-area-inset-right) + 14px));
z-index:50;
display:flex;
flex-direction:column;
align-items:flex-end;
gap:8px;
}

body.hasLoginBar .balanceDock{
top:calc(var(--loginBarH, 72px) + 14px);
}

.balanceBox{
position:relative;
display:flex;
align-items:center;
gap:8px;
padding:10px 16px;
font-size:15px;
letter-spacing:1px;
background:rgba(15,15,15,0.85);
border:1px solid rgba(255,255,255,0.2);
border-radius:6px;
}

.balanceBox:hover::after,
.balanceBox:focus-within::after{
content:"Hour Balance";
position:absolute;
top:calc(100% + 6px);
right:0;
white-space:nowrap;
background:black;
border:1px solid rgba(255,255,255,0.2);
padding:4px 8px;
font-size:12px;
letter-spacing:0;
}

/* SUGGESTIONS */
.suggestBtn{
padding:7px 12px;
font-size:12px;
letter-spacing:2px;
}

.suggestBtn[hidden]{
display:none;
}

.glassCard{
background:
repeating-linear-gradient(
45deg,
rgba(255,255,255,0.05) 0px,
rgba(255,255,255,0.05) 2px,
transparent 2px,
transparent 6px
),
linear-gradient(135deg, rgba(120,80,190,0.22), rgba(255,255,255,0.06));
backdrop-filter:blur(18px) saturate(150%);
-webkit-backdrop-filter:blur(18px) saturate(150%);
border:1px solid rgba(255,255,255,0.22);
box-shadow:0 0 24px rgba(130,70,200,0.25), 0 24px 60px rgba(0,0,0,0.6);
width:min(560px,100%);
}

.glassCard .textInput{
background:rgba(255,255,255,0.07);
border-color:rgba(255,255,255,0.24);
}

.glassCard .textInput:focus{
border-color:rgba(255,255,255,0.7);
box-shadow:0 0 14px rgba(200,160,255,0.35);
}

.suggestTitle{
font-size:clamp(18px,3.4vw,24px);
letter-spacing:4px;
text-transform:uppercase;
margin-bottom:22px;
}

.srOnly{
position:absolute;
width:1px;
height:1px;
margin:-1px;
padding:0;
overflow:hidden;
clip-path:inset(50%);
white-space:nowrap;
border:0;
}

/* TITLE */
.shopTitle{
text-align:center;
margin-top:max(72px, calc(env(safe-area-inset-top) + 68px));
font-size:clamp(26px,7vw,44px);
letter-spacing:6px;
}

.rgbGlitch{
display:inline-block;
animation:rgbShift 3.4s infinite steps(1);
}

.glitchText.rgbGlitch::before{
left:4px;
color:#ff0044;
text-shadow:none;
mix-blend-mode:screen;
animation:glitch1 1.7s infinite linear alternate-reverse;
}

.glitchText.rgbGlitch::after{
left:-4px;
color:#00fff0;
text-shadow:none;
mix-blend-mode:screen;
animation:glitch2 1.7s infinite linear alternate-reverse;
}

@keyframes rgbShift{
0%,88%,100%{transform:translate(0) skewX(0deg);}
89%{transform:translate(-3px,1px) skewX(3deg);}
91%{transform:translate(3px,-1px) skewX(-2deg);}
93%{transform:translate(-2px,0) skewX(1deg);}
95%{transform:translate(2px,1px) skewX(-3deg);}
}

/* ITEM GRID */
.shopGrid{
width:min(1100px, calc(100% - 44px));
margin:44px auto 90px;
display:grid;
grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
gap:20px;
}

.itemCard{
position:relative;

contain:layout paint style;
display:flex;
flex-direction:column;
align-items:center;
padding:18px 14px;
background:rgba(25,25,25,0.85);
border:1px solid rgba(255,255,255,0.08);
border-radius:10px;
text-align:center;
overflow:hidden;
color:#fff;
transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
}

.itemCard:hover,
.itemCard:focus-visible{
outline:none;
transform:translateY(-3px);
border-color:rgba(200,160,255,0.6);
box-shadow:0 0 22px rgba(130,70,200,0.35);
}

.itemCard.glitch{
animation:glitchMove 4s infinite;
}

.itemCard.glitch::before,
.itemCard.glitch::after{
content:"";
position:absolute;
inset:0;
mix-blend-mode:screen;
pointer-events:none;
}

.itemCard.glitch::before{
background:rgba(255,0,0,0.2);
animation:glitchRed 4s infinite;
}

.itemCard.glitch::after{
background:rgba(0,255,255,0.2);
animation:glitchBlue 4s infinite;
}

@keyframes glitchMove{
0%,95%,100%{transform:translate(0);}
96%{transform:translate(-2px,1px);}
97%{transform:translate(3px,-1px);}
98%{transform:translate(-3px,2px);}
99%{transform:translate(2px,-2px);}
}

@keyframes glitchRed{
0%,95%,100%{transform:translate(0);opacity:0;}
97%{transform:translate(-3px,0);opacity:0.4;}
}

@keyframes glitchBlue{
0%,95%,100%{transform:translate(0);opacity:0;}
98%{transform:translate(3px,0);opacity:0.4;}
}

.itemHours{

/* ORDER DIALOG */
.orderBody{

gap:26px;
align-items:center;

.orderInfo{

.orderName{

letter-spacing:3px;

.itemImage,

@media (max-width:360px){

@media (max-height:480px) and (orientation:landscape){

margin-top:max(64px, calc(env(safe-area-inset-top) + 60px));

.volumeDock{

/* REDUCED MOTION */
@media (prefers-reduced-motion: reduce){

.glitchText.rgbGlitch::after{
animation:none !important;
}

.itemCard{
transition:border-color .18s ease;
}

.itemCard:hover,
.itemCard:focus-visible{
transform:none;
}

.videoBG{
display:none;
}
}

<script type="module">
import { SHOP_ITEMS, MAX_QUANTITY, findItem } from "/catalog.js";

// elements
const grid = document.getElementById("shopGrid");
const balanceValue = document.getElementById("balanceValue");

const modal = document.getElementById("orderModal");
const orderName = document.getElementById("orderName");
const orderCost = document.getElementById("orderCost");
const orderDesc = document.getElementById("orderDesc");
const orderBalanceEl = document.getElementById("orderBalance");
const orderArt = document.getElementById("orderArt");
const orderError = document.getElementById("orderError");
const orderBtn = document.getElementById("orderBtn");
const qtyInput = document.getElementById("orderQtyInput");
const toast = document.getElementById("toast");
const suggestBtn = document.getElementById("suggestBtn");
const suggestModal = document.getElementById("suggestModal");
const suggestForm = document.getElementById("suggestForm");
const suggestName = document.getElementById("suggestName");
const suggestReason = document.getElementById("suggestReason");
const suggestError = document.getElementById("suggestError");
const suggestSubmit = document.getElementById("suggestSubmit");
const screenVeil = document.getElementById("screenVeil");

// state
let balanceHours = 0;
let signedIn = false;
let openItem = null;
let returnFocus = null;

// artwork
function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2)
               .map(word => word[0]).join("").toUpperCase();
}

function artwork(item, className) {
    if (item.image) {
        const img = document.createElement("img");
        img.className = className;
        img.src = item.image;
        img.alt = "";

        img.loading = "lazy";
        img.decoding = "async";
        return img;
    }

    const box = document.createElement("div");
    box.className = "itemPlaceholder";
    box.textContent = initials(item.name);
    return box;
}

// price labels
function hoursLabel(hours) {
    return hours + (hours === 1 ? " hour" : " hours");
}

const SVG_NS = "http://www.w3.org/2000/svg";
const XLINK_NS = "http://www.w3.org/1999/xlink";

function hourGlyph() {
    const svg = document.createElementNS(SVG_NS, "svg");
    svg.setAttribute("class", "hourMark");
    svg.setAttribute("aria-hidden", "true");

    const use = document.createElementNS(SVG_NS, "use");
    use.setAttribute("href", "#clockGlyph");

    use.setAttributeNS(XLINK_NS, "xlink:href", "#clockGlyph");

    svg.appendChild(use);
    return svg;
}

// the grid, cheapest first
const cards = [];
const fragment = document.createDocumentFragment();

[...SHOP_ITEMS].sort((a, b) => a.hours - b.hours).forEach(item => {
    const card = document.createElement("button");
    card.className = "itemCard glitch";
    card.type = "button";
    card.dataset.itemId = item.id;

    card.appendChild(artwork(item, "itemImage"));

    const name = document.createElement("div");
    name.className = "itemName";
    name.textContent = item.name;
    card.appendChild(name);

    if (item.note) {
        const note = document.createElement("div");
        note.className = "itemNote";
        note.textContent = item.note;
        card.appendChild(note);
    }

    const price = document.createElement("div");
    price.className = "itemHours";
    price.appendChild(hourGlyph());
    price.appendChild(document.createTextNode(hoursLabel(item.hours)));
    card.appendChild(price);

    card.addEventListener("click", () => openOrder(item.id));
    cards.push(card);
    fragment.appendChild(card);
});

grid.appendChild(fragment);

// keyboard
function columnCount() {
    const tracks = getComputedStyle(grid).gridTemplateColumns;
    if (!tracks || tracks === "none") return 1;
    return Math.max(tracks.trim().split(/\s+/).length, 1);
}

function focusCard(next) {
    const target = cards[Math.min(Math.max(next, 0), cards.length - 1)];
    if (target) target.focus();
}

const ARROWS = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: 0, ArrowDown: 0 };

document.addEventListener("keydown", (e) => {
    if (anyModalOpen()) return;
    if (e.altKey || e.ctrlKey || e.metaKey) return;

    const active = document.activeElement;
    const tag = active ? active.tagName : "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

    const at = cards.indexOf(active);

    if (e.key in ARROWS) {
        e.preventDefault();

        if (at === -1) {
            focusCard(0);
            return;
        }

        const step = ARROWS[e.key] || (e.key === "ArrowDown" ? columnCount() : -columnCount());
        focusCard(at + step);
        return;
    }

    if (at === -1) return;

    if (e.key === "Home") {
        e.preventDefault();
        focusCard(0);
    } else if (e.key === "End") {
        e.preventDefault();
        focusCard(cards.length - 1);
    } else if (e.key === "PageDown") {
        e.preventDefault();
        focusCard(at + columnCount() * 3);
    } else if (e.key === "PageUp") {
        e.preventDefault();
        focusCard(at - columnCount() * 3);
    }
});

// balance
function paintBalance() {
    balanceValue.textContent = String(balanceHours);
    orderBalanceEl.textContent = String(balanceHours);
    updateOrderButton();
}

// polling
const POLL_MS = 15000;
let pollTimer = null;

function startPolling() {
    stopPolling();
    pollTimer = setInterval(() => {
        if (document.visibilityState === "visible") refreshBalance();
    }, POLL_MS);
}

function stopPolling() {
    clearInterval(pollTimer);
    pollTimer = null;
}

async function refreshBalance() {
    let response;
    try {
        response = await fetch("/api/shop/balance", { credentials: "same-origin" });
    } catch {
        return;
    }

    if (response.status === 403) {
        window.location.replace("/ban");
        return;
    }

    if (response.status === 401 || response.status === 404) {
        signedIn = false;
        suggestBtn.hidden = true;
        showLoginBar();
        stopPolling();
        updateOrderButton();
        return;
    }

    if (!response.ok) {
        signedIn = false;
        stopPolling();
        updateOrderButton();
        return;
    }

    try {
        const payload = await response.json();
        signedIn = true;
        suggestBtn.hidden = false;
        balanceHours = Number(payload.balanceHours) || 0;
        paintBalance();
    } catch {
    }
}

// nothing decodes for a hidden tab
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    // start
    refreshBalance();
    if (!pollTimer) startPolling();
});

// quantity
function readQuantity() {
    const value = Number(qtyInput.value);
    if (!Number.isFinite(value)) return 1;
    return Math.min(Math.max(Math.floor(value), 1), MAX_QUANTITY);
}

function updateOrderButton() {
    if (!openItem) return;

    const quantity = readQuantity();
    const cost = Math.round(openItem.hours * quantity * 100) / 100;

    orderCost.textContent = hoursLabel(openItem.hours) + " each · "
                          + hoursLabel(cost) + " total";

    if (!signedIn) {
        orderBtn.textContent = "Log In to Order";
        orderBtn.disabled = false;
        return;
    }

    if (balanceHours >= cost) {
        orderBtn.textContent = "Place Order!";
        orderBtn.disabled = false;
    } else {
        orderBtn.textContent = "Insufficient Funds.";
        orderBtn.disabled = true;
    }
}

// order dialog
function openOrder(itemId) {
    const item = findItem(itemId);
    if (!item) return;

    openItem = item;
    returnFocus = document.activeElement;

    orderName.textContent = item.name + (item.note ? " (" + item.note + ")" : "");

    orderDesc.textContent = item.description || "";

    orderArt.textContent = "";
    orderArt.appendChild(artwork(item, "orderImage"));

    qtyInput.value = "1";
    orderError.textContent = "";
    paintBalance();

    modal.hidden = false;

    requestAnimationFrame(() => modal.classList.add("show"));

    setInertBehind(true, modal);
    document.body.style.overflow = "hidden";
    qtyInput.focus();
    qtyInput.select();
}

function closeOrder() {
    modal.classList.remove("show");
    setInertBehind(false, modal);
    document.body.style.overflow = "";

    setTimeout(() => { if (!modal.classList.contains("show")) modal.hidden = true; }, 240);

    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    returnFocus = null;
    openItem = null;
}

function setInertBehind(on, dialog) {
    Array.from(document.body.children).forEach(child => {
        if (child !== dialog && child.tagName !== "SCRIPT") child.inert = on;
    });
}

function anyModalOpen() {
    return modal.classList.contains("show") || suggestModal.classList.contains("show");
}

qtyInput.addEventListener("input", () => {
    const cleaned = qtyInput.value.replace(/[^\d]/g, "");
    if (cleaned !== qtyInput.value) qtyInput.value = cleaned;
    updateOrderButton();
});

qtyInput.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    qtyInput.value = String(readQuantity());
    updateOrderButton();
    if (!orderBtn.disabled) orderBtn.click();
});

qtyInput.addEventListener("blur", () => {
    qtyInput.value = String(readQuantity());
    updateOrderButton();
});

// placing the order
orderBtn.addEventListener("click", async () => {
    if (!openItem) return;

    if (!signedIn) {
        window.location.href = "/api/auth/login";
        return;
    }

    const quantity = readQuantity();
    const item = openItem;

    orderBtn.disabled = true;
    orderBtn.textContent = "Placing…";
    orderError.textContent = "";

    let response;
    try {
        response = await fetch("/api/shop/order", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ itemId: item.id, quantity })
        });
    } catch {
        orderError.textContent = "Could not reach ZoneOut.";
        updateOrderButton();
        return;
    }

    if (response.status === 403) {
        window.location.replace("/ban");
        return;
    }

    let payload = {};
    try { payload = await response.json(); } catch {  }

    if (!response.ok) {
        orderError.textContent = payload.error || "The order could not be placed.";

        await refreshBalance();
        updateOrderButton();
        return;
    }

    balanceHours = Number(payload.balanceHours) || 0;
    paintBalance();
    closeOrder();
    showToast("Ordered " + quantity + " × " + item.name + ".");
});

document.getElementById("orderClose").addEventListener("click", closeOrder);

modal.addEventListener("mousedown", (e) => {
    if (e.target === modal) closeOrder();
});

document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;

    if (modal.classList.contains("show")) {
        e.preventDefault();
        closeOrder();
    } else if (suggestModal.classList.contains("show")) {
        e.preventDefault();
        closeSuggest();
    }
});

// suggestions
function openSuggest() {
    if (!signedIn) return;

    returnFocus = document.activeElement;
    suggestError.textContent = "";

    suggestModal.hidden = false;

    requestAnimationFrame(() => suggestModal.classList.add("show"));

    setInertBehind(true, suggestModal);
    document.body.style.overflow = "hidden";
    suggestName.focus();
}

function closeSuggest() {
    suggestModal.classList.remove("show");
    setInertBehind(false, suggestModal);
    document.body.style.overflow = "";

    setTimeout(() => {
        if (!suggestModal.classList.contains("show")) suggestModal.hidden = true;
    }, 240);

    if (returnFocus && document.contains(returnFocus)) returnFocus.focus();
    returnFocus = null;
}

suggestBtn.addEventListener("click", openSuggest);
document.getElementById("suggestClose").addEventListener("click", closeSuggest);

suggestModal.addEventListener("mousedown", (e) => {
    if (e.target === suggestModal) closeSuggest();
});

suggestForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const itemName = suggestName.value.trim();
    const reason = suggestReason.value.trim();

    if (!itemName || !reason) {
        suggestError.textContent = "Both fields are required.";
        return;
    }

    suggestSubmit.disabled = true;
    suggestSubmit.textContent = "Sending…";
    suggestError.textContent = "";

    let response;
    try {
        response = await fetch("/api/shop/suggest", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ itemName, reason })
        });
    } catch {
        suggestError.textContent = "Could not reach ZoneOut.";
        suggestSubmit.disabled = false;
        suggestSubmit.textContent = "Send Suggestion";
        return;
    }

    if (response.status === 403) {
        window.location.replace("/ban");
        return;
    }

    let payload = {};
    try { payload = await response.json(); } catch {  }

    suggestSubmit.disabled = false;
    suggestSubmit.textContent = "Send Suggestion";

    if (!response.ok) {
        suggestError.textContent = payload.error || "The suggestion could not be sent.";
        return;
    }

    suggestName.value = "";
    suggestReason.value = "";
    closeSuggest();
    showToast("Suggestion sent. Thank you!");
});

// toast
let toastTimer = null;

function showToast(message) {
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 2600);
}

// audio
const bgAudio = document.getElementById("bgAudio");
const uiClick = document.getElementById("uiClick");
const videoBG = document.getElementById("videoBG");
const volumeSlider = document.getElementById("masterVolume");
const volumeValue = document.getElementById("volumeValue");
const FADE_IN_MS = 1600;

let masterVolume = 0.35;
try {
    const saved = Number(localStorage.getItem("zoneoutVolume"));
    if (Number.isFinite(saved) && saved >= 0 && saved <= 100
        && localStorage.getItem("zoneoutVolume") !== null) {
        masterVolume = saved / 100;
    }
} catch (e) {
}

const clampVolume = level => Math.min(Math.max(level, 0), 1);

let fadeGeneration = 0;

function fadeInAudio() {
    const mine = ++fadeGeneration;
    const start = performance.now();

    function step(now) {
        if (mine !== fadeGeneration) return;
        const progress = Math.min((now - start) / FADE_IN_MS, 1);
        bgAudio.volume = clampVolume(masterVolume * progress);
        if (progress < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
    setTimeout(() => {
        if (mine === fadeGeneration) bgAudio.volume = clampVolume(masterVolume);
    }, FADE_IN_MS + 250);
}

// click sound
function playClick() {
    uiClick.currentTime = 0;
    uiClick.volume = clampVolume(masterVolume * 0.35);
    uiClick.play().catch(() => {});
}

document.addEventListener("click", (e) => {
    if (e.target.closest(".itemCard, .camNode, .backBtn, .modalClose")) playClick();
});

function resumeAudio() {
    if (!bgAudio.paused || masterVolume === 0) return;
    bgAudio.volume = 0;
    bgAudio.play().then(fadeInAudio).catch(() => {});
}

["pointerdown", "touchstart", "keydown"].forEach(evt => {
    document.addEventListener(evt, () => {
        clearTimeout(toastTimer);
        toast.classList.remove("show");
        resumeAudio();
    }, true);
});

// volume
function syncVolumeDisplay() {
    volumeValue.textContent = `${Math.round(masterVolume * 100)}%`;
}

volumeSlider.value = String(Math.round(masterVolume * 100));
syncVolumeDisplay();

volumeSlider.addEventListener("input", () => {
    masterVolume = Number(volumeSlider.value) / 100;
    try { localStorage.setItem("zoneoutVolume", volumeSlider.value); } catch (e) {}

    fadeGeneration++;
    bgAudio.volume = clampVolume(masterVolume);
    syncVolumeDisplay();

    resumeAudio();
});

resumeAudio();
bgAudio.addEventListener("canplay", resumeAudio);

document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") videoBG.play().catch(() => {});
    else videoBG.pause();
});

// cross-document fade
const VEIL_MS = 450;

function fadeUp() {
    const root = document.documentElement;
    requestAnimationFrame(() => root.classList.remove("fadeIn"));
    setTimeout(() => root.classList.remove("fadeIn"), 80);
    screenVeil.classList.remove("on");
}

fadeUp();

function goBack() {
    try { sessionStorage.setItem("zoneoutFadeIn", "1"); } catch (e) {  }
    screenVeil.classList.add("on");

    setTimeout(() => {
        if (!signedIn) window.location.href = "/";
        else if (document.referrer) window.history.back();
        else window.location.href = "/";
    }, VEIL_MS);
}

window.addEventListener("pageshow", (e) => { if (e.persisted) fadeUp(); });

// signed-out bar
const loginBar = document.getElementById("loginBar");

function measureLoginBar() {
    if (loginBar.hidden) return;
    document.body.style.setProperty("--loginBarH", loginBar.offsetHeight + "px");
}

function showLoginBar() {
    if (!loginBar.hidden) return;
    loginBar.hidden = false;
    backBtn.hidden = true;
    document.body.classList.add("hasLoginBar");
    measureLoginBar();
}

window.addEventListener("resize", measureLoginBar);

// back control
const backBtn = document.getElementById("backBtn");
backBtn.addEventListener("click", goBack);

backBtn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        playClick();
        goBack();
    }
});

document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !anyModalOpen()) goBack();
});

refreshBalance();
startPolling();

</script>
