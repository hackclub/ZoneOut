<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Explore every approved ZoneOut project - horror, mystery and ARG builds from Hack Clubbers.">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/themes.css">

<script>
// theme, read before the first paint
try {
    var zoTheme = localStorage.getItem("zoneoutTheme") || "fnaf";
    if (zoTheme !== "default" && /^[a-z0-9-]{1,24}$/.test(zoTheme)) {
        document.documentElement.setAttribute("data-theme", zoTheme);
        var zoMeta = document.querySelector('meta[name="theme-color"]');
        if (zoMeta) zoMeta.content = { bw: "#0a0a0a", fnaf: "#000000", halloween: "#080402" }[zoTheme] || "#000000";
    }
} catch (e) {}
</script>
<title>ZoneOut Archive</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<script>
// fade up from the black the previous page left on
try {
    if (sessionStorage.getItem("zoneoutFadeIn")) {
        sessionStorage.removeItem("zoneoutFadeIn");
        document.documentElement.classList.add("fadeIn");

        setTimeout(function () {
            document.documentElement.classList.remove("fadeIn");
        }, 1200);
    }
} catch (e) {
}

// the gallery request, started before the stylesheet settles
window.__explorePromise = fetch("/api/explore", { credentials: "same-origin" });
window.__explorePromise.catch(function () {  });
</script>

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Courier New",monospace;
}

body{
background:rgb(var(--bg));
color:rgb(var(--fg));
line-height:1.6;
min-height:100vh;
min-height:100dvh;
overflow-x:hidden;
-webkit-text-size-adjust:100%;
text-size-adjust:100%;
}

html.fadeIn .screenVeil{
opacity:1;
}

/* BACKDROP */
.videoBG{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
min-width:100%;
min-height:100%;
object-fit:cover;
transform:translate(-50%,-50%);
z-index:-2;
pointer-events:none;
}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle at center, rgba(var(--bg),0.35), rgba(var(--bg),0.94));
z-index:-1;
pointer-events:none;
}

/* BACK CONTROL */
.backBtn{
display:block;
position:fixed;
top:max(20px, calc(env(safe-area-inset-top) + 12px));
left:max(20px, calc(env(safe-area-inset-left) + 14px));
cursor:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='28'%20height='28'%20viewBox='0%200%2028%2028'%3E%3Cpath%20d='M2%2014s5-7%2012-7%2012%207%2012%207-5%207-12%207S2%2014%202%2014z'%20fill='%23000000'%20stroke='%23ffffff'%20stroke-width='1.6'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='4.8'%20fill='%23ffffff'/%3E%3Ccircle%20cx='14'%20cy='14'%20r='1.7'%20fill='%23000000'/%3E%3C/svg%3E") 14 14, pointer;
font-size:16px;
opacity:0.7;
transition:opacity .2s ease, transform .2s ease, text-shadow .2s ease;
z-index:80;
color:rgb(var(--fg));
}

.backBtn[hidden]{
display:none;
}

.backBtn:hover,
.backBtn:focus-visible{
opacity:1;
outline:none;
text-shadow:0 0 6px rgb(var(--fg));
}

/* HEADER */
.exploreWrap{
width:min(1180px, calc(100% - 32px));
margin:0 auto;
overflow-x:clip;
padding:min(10vh,88px) 0 110px;
}

.exploreHead{
text-align:center;
margin-bottom:46px;
}

.exploreTitle{
display:inline-block;
margin:8px 0 6px;
font-size:clamp(24px,6vw,56px);
line-height:1.1;
letter-spacing:clamp(3px,1.2vw,10px);
}

.exploreSub{
font-size:13px;
letter-spacing:3px;
text-transform:uppercase;
animation:subFlicker 6s infinite;
}

@keyframes subFlicker{
0%,100%{opacity:0.8;}
61%{opacity:0.8;}
62%{opacity:0.25;}
63%{opacity:0.8;}
64%{opacity:0.4;}
66%{opacity:0.8;}
}

/* GRID */
.exploreGrid{
display:grid;
grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
gap:40px 30px;
padding:0 10px;
}

.exploreEmpty{
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
margin-top:30px;
letter-spacing:4px;
color:rgb(var(--bloodText));
}

.exploreEmpty[hidden]{
display:none;
}

/* CARD */
.exploreCard{
position:relative;
display:flex;
flex-direction:column;
gap:10px;
padding:12px 12px 10px;
color:rgb(var(--fg));
text-decoration:none;
background:linear-gradient(165deg, rgba(var(--panelTop),0.6), rgba(var(--panelBot),0.94));
border:1px solid rgba(var(--fg),0.28);
transform:rotate(var(--tilt, 0deg));
transition:transform .25s ease, border-color .2s ease, box-shadow .2s ease;
outline:none;
}

.exploreCard:hover,
.exploreCard:focus-visible{
transform:rotate(0deg) translateY(-4px);
border-color:rgb(var(--fg));
box-shadow:inset 0 0 0 1px rgba(var(--fg),0.55), inset 0 0 22px rgba(var(--fg),0.12);
z-index:3;
}

.cardTile{
position:relative;
display:flex;
align-items:center;
justify-content:center;
aspect-ratio:1 / 1;
padding:10px;
overflow:hidden;
text-align:center;
word-break:break-word;
line-height:1.15;
letter-spacing:1px;
font-weight:bold;
text-transform:uppercase;
color:rgb(var(--accentTextSoft));
background:
repeating-linear-gradient(
45deg,
rgba(var(--fg),0.05) 0px,
rgba(var(--fg),0.05) 2px,
transparent 2px,
transparent 6px
),
linear-gradient(135deg, rgb(var(--panelTopAlt)), rgb(var(--panelBotAlt)));
border:1px solid rgba(var(--accent),0.25);
}

.cardTile::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(ellipse at 50% 85%, rgba(var(--tint),0.22), transparent 70%);
}

.exploreCard{ --tint:var(--ghostText); }
.exploreCard[data-deco~="drips"],
.exploreCard[data-deco~="claws"],
.exploreCard[data-deco~="static"]{ --tint:var(--bloodEdge); }
.exploreCard[data-deco~="zoneout"]{ --tint:var(--zoGlow); }
.exploreCard[data-deco~="desktop"]{ --tint:var(--deskInk); }
.exploreCard[data-deco~="pumpkin"],
.exploreCard[data-deco~="candles"],
.exploreCard[data-deco~="evidence"],
.exploreCard[data-deco~="masking"],
.exploreCard[data-deco~="gun"]{ --tint:var(--pumpkinEmber); }
.exploreCard[data-deco~="tear"],
.exploreCard[data-deco~="slice"]{ --tint:var(--glitchCyan); }
.exploreCard[data-deco~="cam"]{ --tint:var(--hourBar); }
.exploreCard[data-deco~="tape"]{ --tint:var(--cautionTape); }
.exploreCard[data-deco~="crt"]{ --tint:var(--phosphor); }
.exploreCard[data-deco~="lurker"]{ --tint:var(--lurkGlass); }

.tileName{
position:relative;
z-index:1;
}

.tileScan{
position:absolute;
inset:0;
z-index:2;
pointer-events:none;
background:
repeating-linear-gradient(0deg, rgba(var(--bg),0.22) 0px, rgba(var(--bg),0.22) 1px, transparent 1px, transparent 3px),
radial-gradient(circle at center, transparent 55%, rgba(var(--bg),0.55));
}

.tileScan::after{
content:"";
position:absolute;
left:0;
right:0;
top:0;
height:18%;
background:linear-gradient(to bottom, transparent, rgba(var(--fg),0.07), transparent);
transform:translateY(-100%);
}

.exploreCard.live .tileScan::after{
animation:scanRoll 5.5s linear infinite;
animation-delay:var(--phase, 0s);
}

@keyframes scanRoll{
from{transform:translateY(-100%);}
to{transform:translateY(560%);}
}

.cardMeta{
display:flex;
flex-direction:column;
gap:2px;
min-width:0;
}

.cardName{
font-size:15px;
font-weight:bold;
line-height:1.3;
overflow-wrap:anywhere;
}

.cardOwner{
font-size:12px;
letter-spacing:1px;
opacity:0.7;
overflow-wrap:anywhere;
}

.cardFoot{
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
font-size:11px;
letter-spacing:2px;
opacity:0.6;
border-top:1px dashed rgba(var(--fg),0.2);
padding-top:6px;
}

.camTag::before{
content:"";
display:inline-block;
width:6px;
height:6px;
margin-right:6px;
vertical-align:1px;
background:rgb(var(--bloodText));
}

/* DECOR, SHARED */
.deco,
.decoClip{
position:absolute;
pointer-events:none;
}

.deco{
inset:0;
z-index:4;
}

.decoClip{
inset:0;
overflow:hidden;
z-index:4;
}

.tileDeco{
position:absolute;
inset:0;
z-index:3;
pointer-events:none;
}

.deco svg,
.tileDeco svg{
position:absolute;
display:block;
overflow:visible;
}

/* DECOR, COBWEB */
.webSvg{
top:-6px;
left:-6px;
width:96px;
height:96px;
}

.webSvg path{
fill:none;
stroke:rgba(var(--fg),0.5);
stroke-width:0.8;
}

.spider{
position:absolute;
top:-4px;
left:70px;
width:12px;
transform-origin:50% 0;
}

.spider::before{
content:"";
display:block;
width:1px;
height:42px;
margin:0 auto;
background:rgba(var(--fg),0.5);
}

.spider svg{
position:static;
width:12px;
height:12px;
fill:rgb(var(--fg));
}

.spider .legs{
fill:none;
stroke:rgb(var(--fg));
stroke-width:0.8;
}

.exploreCard.live .spider{
animation:spiderSway 4.2s ease-in-out infinite;
}

@keyframes spiderSway{
0%,100%{transform:rotate(-7deg);}
50%{transform:rotate(7deg);}
}

/* DECOR, CAUTION TAPE */
.tape{
position:absolute;
top:30px;
right:-58px;
width:230px;
height:24px;
transform:rotate(38deg);
display:flex;
align-items:center;
justify-content:center;
font-size:10px;
font-weight:bold;
letter-spacing:2px;
white-space:nowrap;
color:rgb(var(--cautionInk));
background:rgb(var(--cautionTape));
box-shadow:0 2px 6px rgba(var(--bg),0.6);
}

.tape::before,
.tape::after{
content:"";
position:absolute;
left:0;
right:0;
height:4px;
background:repeating-linear-gradient(-45deg, rgb(var(--cautionInk)) 0px, rgb(var(--cautionInk)) 5px, rgb(var(--cautionTape)) 5px, rgb(var(--cautionTape)) 10px);
}

.tape::before{
top:0;
}

.tape::after{
bottom:0;
}

.tape.low{
right:auto;
left:-58px;
transform:rotate(-38deg);
}

/* DECOR, CLAW MARKS */
.clawSvg{
top:8%;
left:12%;
width:76%;
height:62%;
}

.clawSvg .cut{
fill:rgb(var(--bloodEdge));
}

.clawSvg .wound{
fill:rgb(var(--bloodDeep));
}

/* DECOR, MASKING TAPE */
.mtape{
position:absolute;
width:70px;
height:20px;
background:rgba(var(--maskTape),0.82);
box-shadow:0 1px 3px rgba(var(--bg),0.5);
clip-path:polygon(4% 0, 96% 0, 100% 20%, 95% 42%, 100% 64%, 96% 100%, 3% 100%, 0 78%, 5% 55%, 0 30%);
}

.mtape.one{
top:-8px;
left:-20px;
transform:rotate(-34deg);
}

.mtape.two{
top:-6px;
right:-20px;
transform:rotate(30deg);
}

.mtapeNote{
position:absolute;
right:10px;
bottom:-11px;
padding:1px 8px;
font-size:10px;
font-weight:bold;
letter-spacing:2px;
color:rgb(var(--cautionInk));
background:rgba(var(--maskTape),0.92);
transform:rotate(-3deg);
}

.mtapeNote.long{
font-size:9px;
letter-spacing:1px;
white-space:nowrap;
}

/* DECOR, BLOOD DRIPS */
.dripSvg{
top:-1px;
left:-1px;
width:calc(100% + 2px);
height:70px;
}

.dripTop{ stop-color:rgb(var(--bloodEdge)); }
.dripEnd{ stop-color:rgb(var(--bloodDeep)); }

.dripDrop{
fill:rgb(var(--bloodEdge));
transform-box:fill-box;
transform-origin:50% 0;
opacity:0;
}

.exploreCard.live .dripDrop{
animation:dripFall 4.6s ease-in infinite;
animation-delay:var(--phase, 0s);
}

@keyframes dripFall{
0%,55%{opacity:0;transform:translateY(0) scale(0.4);}
62%{opacity:1;transform:translateY(0) scale(1);}
100%{opacity:0;transform:translateY(190px) scale(1);}
}

/* DECOR, RGB TEAR */
.tear{
position:absolute;
inset:-1px;
border:1px solid rgb(var(--glitchRed));
clip-path:inset(12% 0 70% 0);
transform:translateX(3px);
mix-blend-mode:screen;
}

.tear.cyan{
border-color:rgb(var(--glitchCyan));
clip-path:inset(58% 0 22% 0);
transform:translateX(-3px);
}

.exploreCard.live .tear{
animation:tearJump 3.1s steps(1, end) infinite;
}

.exploreCard.live .tear.cyan{
animation:tearJumpB 2.6s steps(1, end) infinite;
}

@keyframes tearJump{
0%{clip-path:inset(12% 0 70% 0);transform:translateX(3px);}
30%{clip-path:inset(44% 0 41% 0);transform:translateX(-4px);}
55%{clip-path:inset(78% 0 8% 0);transform:translateX(2px);}
80%{clip-path:inset(4% 0 88% 0);transform:translateX(5px);}
}

@keyframes tearJumpB{
0%{clip-path:inset(58% 0 22% 0);transform:translateX(-3px);}
35%{clip-path:inset(20% 0 66% 0);transform:translateX(4px);}
70%{clip-path:inset(86% 0 4% 0);transform:translateX(-5px);}
}

.tearTitle{
position:absolute;
top:16px;
right:-10px;
padding:6px 1px;
writing-mode:vertical-rl;
font-size:10px;
letter-spacing:2px;
color:rgb(var(--glitchCyan));
background:rgb(var(--bg));
border:1px solid rgb(var(--glitchRed));
}

/* DECOR, CAMERA FEED */
.viewCorner{
position:absolute;
width:16px;
height:16px;
border:2px solid rgba(var(--fg),0.8);
}

.viewCorner.tl{ top:8px; left:8px; border-right:none; border-bottom:none; }
.viewCorner.tr{ top:8px; right:8px; border-left:none; border-bottom:none; }
.viewCorner.bl{ bottom:8px; left:8px; border-right:none; border-top:none; }
.viewCorner.br{ bottom:8px; right:8px; border-left:none; border-top:none; }

.recMark{
position:absolute;
top:12px;
left:30px;
font-size:11px;
font-weight:bold;
letter-spacing:2px;
color:rgb(var(--bloodText));
text-transform:none;
}

.exploreCard.live .recMark{
animation:recBlink 1.4s steps(1, end) infinite;
}

@keyframes recBlink{
0%{opacity:1;}
50%{opacity:0.15;}
}

.timeMark{
position:absolute;
right:30px;
bottom:11px;
font-size:10px;
letter-spacing:1px;
color:rgba(var(--fg),0.85);
}

/* DECOR, PIXEL PUMPKIN */
.pumpkinSvg{
right:-14px;
bottom:-16px;
width:50px;
height:46px;
shape-rendering:crispEdges;
}

.pumpkinSvg .rind{ fill:rgb(var(--pumpkinHot)); }
.pumpkinSvg .rindDark{ fill:rgb(var(--pumpkinEmber)); }
.pumpkinSvg .stem{ fill:rgb(var(--bloodDeep)); }
.pumpkinSvg .glow{ fill:rgb(var(--cautionTape)); }

.exploreCard.live .pumpkinSvg .glow{
animation:candle 1.9s steps(1, end) infinite;
}

@keyframes candle{
0%{opacity:1;}
22%{opacity:0.6;}
30%{opacity:1;}
61%{opacity:0.8;}
68%{opacity:0.45;}
74%{opacity:1;}
}

/* DECOR, GLITCH SLICE */
.sliceLayer{
position:absolute;
inset:0;
display:flex;
align-items:center;
justify-content:center;
padding:10px;
color:rgb(var(--glitchCyan));
clip-path:inset(46% 0 40% 0);
transform:translateX(5px);
}

.sliceLayer.red{
color:rgb(var(--glitchRed));
clip-path:inset(30% 0 62% 0);
transform:translateX(-4px);
}

.exploreCard.live .sliceLayer{
animation:sliceJump 2.4s steps(1, end) infinite;
animation-delay:var(--phase, 0s);
}

.exploreCard.live .sliceLayer.red{
animation-name:sliceJumpB;
}

@keyframes sliceJump{
0%{clip-path:inset(46% 0 40% 0);transform:translateX(5px);}
18%{clip-path:inset(62% 0 26% 0);transform:translateX(-6px);}
36%{clip-path:inset(100% 0 0 0);transform:translateX(0);}
71%{clip-path:inset(18% 0 70% 0);transform:translateX(8px);}
86%{clip-path:inset(100% 0 0 0);transform:translateX(0);}
}

@keyframes sliceJumpB{
0%{clip-path:inset(30% 0 62% 0);transform:translateX(-4px);}
24%{clip-path:inset(100% 0 0 0);transform:translateX(0);}
52%{clip-path:inset(54% 0 36% 0);transform:translateX(-7px);}
66%{clip-path:inset(100% 0 0 0);transform:translateX(0);}
}

/* DECOR, BATS */
.batSvg{
fill:rgba(var(--fg),0.88);
transform-origin:50% 50%;
}

.batSvg .batEye{
fill:rgb(var(--bloodText));
}

.batSvg.b1{ top:-30px; right:18px; width:50px; height:20px; }
.batSvg.b2{ top:-16px; right:76px; width:34px; height:14px; }
.batSvg.b3{ top:-40px; right:-14px; width:28px; height:11px; }

.exploreCard.live .batSvg{
animation:batFlap .36s ease-in-out infinite alternate;
}

.exploreCard.live .batSvg.b2{
animation-duration:.3s;
animation-delay:-.12s;
}

.exploreCard.live .batSvg.b3{
animation-duration:.42s;
animation-delay:-.2s;
}

@keyframes batFlap{
from{transform:scaleY(1);}
to{transform:scaleY(0.45);}
}

/* DECOR, EVIDENCE TAG */
.evString{
position:absolute;
top:-2px;
right:20px;
width:1px;
height:30px;
background:rgba(var(--fg),0.6);
}

.evTag{
position:absolute;
top:26px;
right:-16px;
width:80px;
padding:14px 6px 6px;
text-align:center;
font-size:9px;
font-weight:bold;
letter-spacing:1px;
line-height:1.35;
color:rgb(var(--cautionInk));
background:radial-gradient(circle at 50% 7px, rgb(var(--bg)) 0 3px, rgba(var(--fg),0.2) 3px 4px, transparent 4px), rgb(var(--maskTape));
clip-path:polygon(18% 0, 82% 0, 100% 16%, 100% 100%, 0 100%, 0 16%);
transform:rotate(12deg);
transform-origin:60% 0;
}

.evTag b{
display:block;
font-size:13px;
color:rgb(var(--bloodEdge));
}

.exploreCard.live .evTag{
animation:tagSwing 5s ease-in-out infinite;
}

@keyframes tagSwing{
0%,100%{transform:rotate(12deg);}
50%{transform:rotate(5deg);}
}

/* DECOR, STATIC */
.noiseSvg{
right:0;
bottom:0;
width:62%;
height:62%;
}

.noiseInk{
flood-color:rgb(var(--fg));
}

.exploreCard.live .noiseSvg{
animation:noiseShift .28s steps(1, end) infinite;
}

@keyframes noiseShift{
0%{transform:translate(0,0);}
33%{transform:translate(-3px,2px);}
66%{transform:translate(2px,-2px);}
}

.lostStamp{
position:absolute;
right:10px;
bottom:20px;
padding:2px 7px;
font-size:12px;
font-weight:bold;
letter-spacing:2px;
color:rgb(var(--bloodText));
border:2px solid rgb(var(--bloodText));
background:rgba(var(--bloodDark),0.75);
transform:rotate(-11deg);
}

.exploreCard.live .lostStamp{
animation:stampFlicker 2.8s steps(1, end) infinite;
}

@keyframes stampFlicker{
0%{opacity:1;}
70%{opacity:0.55;}
76%{opacity:1;}
}

/* DECOR, THE EYE */
.eyeSvg{
top:38%;
left:-19px;
width:38px;
height:38px;
}

.eyeSvg .lid{
fill:rgb(var(--bg));
stroke:rgb(var(--fg));
stroke-width:1.6;
}

.eyeSvg .iris{ fill:rgb(var(--fg)); }
.eyeSvg .pupil{ fill:rgb(var(--bg)); }

.eyeSvg .ball{
transform-box:fill-box;
transform-origin:50% 50%;
}

.exploreCard.live .eyeSvg .ball{
animation:eyeBlink 5.2s steps(1, end) infinite;
animation-delay:var(--phase, 0s);
}

.exploreCard.live .eyeSvg .look{
animation:eyeLook 7s ease-in-out infinite;
}

@keyframes eyeBlink{
0%{transform:scaleY(1);}
92%{transform:scaleY(0.1);}
95%{transform:scaleY(1);}
}

@keyframes eyeLook{
0%,100%{transform:translateX(0);}
30%{transform:translateX(3px);}
65%{transform:translateX(-3px);}
}

/* DECOR, CANDLES */
.candle{
position:absolute;
bottom:-4px;
width:12px;
background:linear-gradient(90deg, rgba(var(--maskTape),0.75), rgb(var(--maskTape)) 45%, rgba(var(--maskTape),0.7));
border-radius:2px 2px 0 0;
}

.candle.c1{ left:-12px; height:46px; width:15px; }
.candle.c2{ left:6px; height:30px; width:12px; }

.candle::before{
content:"";

<script>

var VEIL_MS = 450;
var grid = document.getElementById("exploreGrid");
var exploreSub = document.getElementById("exploreSub");
var exploreEmpty = document.getElementById("exploreEmpty");
var backBtn = document.getElementById("backBtn");

document.documentElement.dataset.gear = "on";

// arrival fade
var root = document.documentElement;
requestAnimationFrame(function () { root.classList.remove("fadeIn"); });
setTimeout(function () { root.classList.remove("fadeIn"); }, 80);

// bfcache restores the veil opaque and re-runs no script
window.addEventListener("pageshow", function (e) {
    if (e.persisted) document.getElementById("screenVeil").classList.remove("on");
});

function leaveTo(href) {
    try { sessionStorage.setItem("zoneoutFadeIn", "1"); } catch (e) {  }
    document.getElementById("screenVeil").classList.add("on");
    setTimeout(function () { window.location.href = href; }, VEIL_MS);
}

// back control
function cameFromThisSite() {
    if (!document.referrer) return false;
    try {
        return new URL(document.referrer).origin === location.origin;
    } catch (e) {
        return false;
    }
}

function goBack() {
    if (cameFromThisSite() && history.length > 1) {
        history.back();
        return;
    }
    leaveTo("/");
}

backBtn.addEventListener("click", goBack);
backBtn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        playClick();
        goBack();
    }
});

// thumbnail sizing
function thumbFontSize(name, boxPx) {
    var text = (name || "").trim();
    var length = text.length;

    var byLines = 12;
    if (length <= 4) byLines = 34;
    else if (length <= 8) byLines = 26;
    else if (length <= 14) byLines = 20;
    else if (length <= 24) byLines = 16;
    else if (length <= 40) byLines = 14;

    var longest = text.split(/\s+/).reduce(function (max, word) {
        return Math.max(max, word.length);
    }, 1);
    var byWidth = Math.floor(boxPx / (longest * 0.6 + 1));

    return Math.max(9, Math.min(byLines, byWidth));
}

// section for card decor
var DECOR = ["web", "tape", "claws", "masking", "drips", "tear", "cam", "pumpkin", "slice", "bats", "evidence", "static", "eye", "candles"];
var PICK_DECOR = {
    23: "zoneout", 37: "desktop", 33: "cam", 64: "evidence", 170: "candles", 146: "static", 82: "tape",
    59: "crt", 32: "lurker", 78: "static", 171: "slice gun", 169: "flyer", 88: "tear",
    150: "masking", 47: "masking",
    100: "candles", 117: "evidence", 80: "slice", 158: "pumpkin", 172: "slice", 43: "eye"
};
var PICK_NOTES = { 150: "MISSING PERSON SPOTTED.", 47: "BODY SPOTTED" };

function seeded(seed) {
    var s = seed >>> 0;
    return function () {
        s = (s + 0x6D2B79F5) >>> 0;
        var t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
}

function pickDecor(list) {
    var recent = [];
    return list.map(function (project) {
        var kind = PICK_DECOR[project.projectId];
        if (!kind) {
            var at = Math.floor(seeded(project.projectId * 7919)() * DECOR.length);
            while (recent.indexOf(DECOR[at]) !== -1) at = (at + 1) % DECOR.length;
            kind = DECOR[at];
        }
        recent.push(kind);
        if (recent.length > 4) recent.shift();
        return kind;
    });
}

function webPath() {
    var spokes = [0, 7, 33, 58, 83, 90];
    var d = "";
    spokes.forEach(function (deg) {
        var r = deg * Math.PI / 180;
        d += "M0 0L" + (96 * Math.cos(r)).toFixed(1) + " " + (96 * Math.sin(r)).toFixed(1);
    });
    [20, 38, 58, 78].forEach(function (radius) {
        for (var i = 0; i < spokes.length - 1; i++) {
            var a = spokes[i] * Math.PI / 180;
            var b = spokes[i + 1] * Math.PI / 180;
            var mid = (a + b) / 2;
            var sag = radius * 0.86;
            d += "M" + (radius * Math.cos(a)).toFixed(1) + " " + (radius * Math.sin(a)).toFixed(1)
               + "Q" + (sag * Math.cos(mid)).toFixed(1) + " " + (sag * Math.sin(mid)).toFixed(1)
               + " " + (radius * Math.cos(b)).toFixed(1) + " " + (radius * Math.sin(b)).toFixed(1);
        }
    });
    return d;
}

var WEB_PATH = webPath();

function dripSvg(id) {
    var rand = seeded(id * 31 + 7);
    var d = "M0 0H100V5";
    var x = 100;
    var tips = [];
    while (x > 4) {
        var step = 7 + rand() * 12;
        var next = Math.max(x - step, 0);
        var mid = (x + next) / 2;
        var len = rand() < 0.72 ? 10 + rand() * 30 : 4 + rand() * 4;
        var w = Math.min(2.4 + rand() * 1.8, step / 2.4);
        d += "L" + (mid + w).toFixed(1) + " 5"
           + "C" + (mid + w).toFixed(1) + " " + (len * 0.7).toFixed(1) + " " + (mid + w * 1.3).toFixed(1) + " " + len.toFixed(1) + " " + mid.toFixed(1) + " " + len.toFixed(1)
           + "C" + (mid - w * 1.3).toFixed(1) + " " + len.toFixed(1) + " " + (mid - w).toFixed(1) + " " + (len * 0.7).toFixed(1) + " " + (mid - w).toFixed(1) + " 5";
        if (len > 10) tips.push({ x: mid, len: len });
        x = next;

    d += "L0 5Z";

    var drops = "";
    tips.forEach(function (tip, i) {
        if (i > 0 && rand() < 0.35) return;
        drops += '<ellipse class="dripDrop" cx="' + tip.x.toFixed(1) + '" cy="' + (tip.len + 2).toFixed(1) + '" rx="1.3" ry="2.2"'
               + ' style="animation-duration:' + (3.4 + rand() * 4.2).toFixed(2) + 's;animation-delay:' + (-rand() * 8).toFixed(2) + 's"/>';
    });

        var nx = -dy / len * w, ny = dx / len * w;
        return "M" + x1 + " " + y1
             + "Q" + ((x1 + x2) / 2 + nx).toFixed(1) + " " + ((y1 + y2) / 2 + ny).toFixed(1) + " " + x2 + " " + y2
             + "Q" + ((x1 + x2) / 2 - nx * 0.2).toFixed(1) + " " + ((y1 + y2) / 2 - ny * 0.2).toFixed(1) + " " + x1 + " " + y1 + "Z";
    };
    var marks = [[30, 0, 6, 96, 4.5], [56, 2, 32, 100, 5.5], [82, 6, 60, 96, 4]];
    var wounds = "", cuts = "";
    marks.forEach(function (m) {

        cuts += '<path class="cut" d="' + cut(m[0], m[1], m[2], m[3], m[4]) + '"/>';

function mergeDecor(kind, project) {
    var merged = { tile: "", edge: "", clip: "", under: "" };
    kind.split(" ").forEach(function (part) {

// section for the gallery
function hoursLabel(hours) {
    var value = Number(hours) || 0;
    if (value <= 0) return "";
    return (Math.round(value * 10) / 10) + " HRS";
}

function buildCard(project, index, kind) {
    var rand = seeded(project.projectId * 131);

    var card = document.createElement("a");
    card.className = "exploreCard";
    card.href = "/projects/" + project.projectId;
    card.dataset.deco = kind;
    card.style.setProperty("--tilt", ((rand() * 2.4) - 1.2).toFixed(2) + "deg");
    card.style.setProperty("--phase", (-rand() * 5).toFixed(2) + "s");
    card.setAttribute("aria-label", project.name + (project.ownerName ? " by " + project.ownerName : ""));

    var decor = mergeDecor(kind, project);

    if (decor.under) {
        var under = document.createElement("span");
        under.className = "lurkLayer";
        under.setAttribute("aria-hidden", "true");
        under.innerHTML = decor.under;
        card.appendChild(under);
    }

    var tile = document.createElement("span");
    tile.className = "cardTile";
    var tileName = document.createElement("span");
    tileName.className = "tileName";
    tileName.textContent = project.name;
    if (kind.split(" ").indexOf("zoneout") !== -1) {
        tileName.classList.add("glitchText");
        tileName.setAttribute("data-text", project.name);
        card.style.setProperty("--tilt", "0deg");
    }
    tile.appendChild(tileName);

    if (decor.tile) {
        var tileDeco = document.createElement("span");
        tileDeco.className = "tileDeco";
        tileDeco.setAttribute("aria-hidden", "true");
        tileDeco.innerHTML = decor.tile;
        var slices = tileDeco.querySelectorAll(".sliceLayer");
        for (var i = 0; i < slices.length; i++) slices[i].textContent = project.name;
        tile.appendChild(tileDeco);
    }

    var scan = document.createElement("span");
    scan.className = "tileScan";
    tile.appendChild(scan);

    var meta = document.createElement("span");
    meta.className = "cardMeta";
    var name = document.createElement("span");
    name.className = "cardName";
    name.textContent = project.name;
    meta.appendChild(name);
    if (project.ownerName) {
        var owner = document.createElement("span");
        owner.className = "cardOwner";
        owner.textContent = "BY " + project.ownerName;
        meta.appendChild(owner);
    }

    var foot = document.createElement("span");
    foot.className = "cardFoot";
    var cam = document.createElement("span");
    cam.className = "camTag";
    cam.textContent = "CAM " + pad(index + 1, 2);
    var hours = document.createElement("span");
    hours.textContent = hoursLabel(project.approvedHours);
    foot.appendChild(cam);
    foot.appendChild(hours);

    card.appendChild(tile);
    card.appendChild(meta);
    card.appendChild(foot);

    if (decor.edge) {
        var edge = document.createElement("span");
        edge.className = "deco";
        edge.setAttribute("aria-hidden", "true");
        edge.innerHTML = decor.edge;
        card.appendChild(edge);
    }

    if (decor.clip) {
        var clip = document.createElement("span");
        clip.className = "decoClip";
        clip.setAttribute("aria-hidden", "true");
        clip.innerHTML = decor.clip;
        card.appendChild(clip);
    }

    return card;
}

var liveWatch = "IntersectionObserver" in window
    ? new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
            entry.target.classList.toggle("live", entry.isIntersecting);
        });
    }, { rootMargin: "120px 0px" })
    : null;

function renderGallery(list) {
    if (liveWatch) liveWatch.disconnect();
    grid.textContent = "";

    var kinds = pickDecor(list);
    var fragment = document.createDocumentFragment();
    var cards = list.map(function (project, i) {
        var card = buildCard(project, i, kinds[i]);
        fragment.appendChild(card);
        return card;
    });
    grid.appendChild(fragment);

    if (cards.length) {
        var width = cards[0].querySelector(".cardTile").getBoundingClientRect().width;
        var box = (width > 40 ? width : 196) - 20;
        cards.forEach(function (card, i) {
            card.querySelector(".cardTile").style.fontSize = thumbFontSize(list[i].name, box) + "px";
        });
    }

    cards.forEach(function (card) {
        if (liveWatch) liveWatch.observe(card);
        else card.classList.add("live");
    });

    exploreSub.textContent = list.length + (list.length === 1 ? " Approved Project" : " Approved Projects");
    exploreEmpty.hidden = list.length > 0;
    if (!list.length) document.getElementById("emptyText").textContent = "NO TRANSMISSIONS YET";
}

function failGallery() {
    exploreSub.textContent = "NO SIGNAL";
    document.getElementById("emptyText").textContent = "SIGNAL LOST";
    exploreEmpty.hidden = false;
}

var galleryGeneration = 0;

function loadGallery(request) {
    var mine = ++galleryGeneration;
    exploreSub.textContent = "TUNING IN…";
    exploreEmpty.hidden = true;

    request
        .then(function (res) {
            if (!res.ok) throw new Error("status " + res.status);
            return res.json();
        })
        .then(function (payload) {
            if (mine !== galleryGeneration) return;
            renderGallery(Array.isArray(payload.projects) ? payload.projects : []);
        })
        .catch(function () {
            if (mine === galleryGeneration) failGallery();
        });
}

document.getElementById("retryBtn").addEventListener("click", function () {
    loadGallery(fetch("/api/explore", { credentials: "same-origin" }));
});

grid.addEventListener("click", function (e) {
    var card = e.target.closest(".exploreCard");
    if (!card) return;
    if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    e.preventDefault();
    playClick();
    leaveTo(card.getAttribute("href"));
});

// keyboard controls
function isTyping() {
    var active = document.activeElement;
    if (!active) return false;
    var tag = active.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}

function cardList() {
    return Array.prototype.slice.call(grid.querySelectorAll(".exploreCard"));
}

function controls() {
    var list = [];
    if (window.zoneoutSettings && window.zoneoutSettings.isOpen()) return list;

    if (!backBtn.hidden) list.push(backBtn);
    list = list.concat(cardList());

    var retry = document.getElementById("retryBtn");
    if (!exploreEmpty.hidden && retry.getClientRects().length > 0) list.push(retry);

    var gear = document.getElementById("settingsGear");
    if (gear && document.documentElement.getAttribute("data-gear") === "on") list.push(gear);

    return list;
}

function gridColumns() {
    var tracks = getComputedStyle(grid).gridTemplateColumns;
    return Math.max(1, tracks.split(" ").filter(Boolean).length);
}

function stepFocus(delta) {
    var list = controls();
    if (!list.length) return;

    var at = list.indexOf(document.activeElement);
    var next = at === -1
        ? (delta > 0 ? 0 : list.length - 1)
        : (at + delta + list.length) % list.length;

    list[next].focus();
}

function stepRow(direction) {
    var cards = cardList();
    var at = cards.indexOf(document.activeElement);
    if (at === -1) {
        stepFocus(direction);
        return;
    }

    var next = at + direction * gridColumns();
    if (next < 0) {
        backBtn.focus();
        return;
    }
    if (next >= cards.length) next = cards.length - 1;
    cards[next].focus();
}

function focusEnd(last) {
    var list = controls();
    if (!list.length) return;
    list[last ? list.length - 1 : 0].focus();
}

document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    if (window.zoneoutSettings && window.zoneoutSettings.isOpen()) return;
    if (isTyping()) return;

    if (e.key === "Escape") {
        e.preventDefault();
        goBack();
        return;
    }

    if (e.key === "ArrowRight") {
        e.preventDefault();
        stepFocus(1);
    } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        stepFocus(-1);
    } else if (e.key === "ArrowDown") {
        e.preventDefault();
        stepRow(1);
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        stepRow(-1);
    } else if (e.key === "Home") {
        e.preventDefault();
        focusEnd(false);
    } else if (e.key === "End") {
        e.preventDefault();
        focusEnd(true);
    }
});

// gestures
["pointerdown", "touchstart", "keydown"].forEach(function (evt) {
    document.addEventListener(evt, function () {
        resumeAudio();
    }, true);
});

// audio
var bgAudio = document.getElementById("bgAudio");
var uiClick = document.getElementById("uiClick");
var FADE_IN_MS = 1600;

var masterVolume = 0.35;
try {
    var savedVolume = Number(localStorage.getItem("zoneoutVolume"));
    if (Number.isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 100
        && localStorage.getItem("zoneoutVolume") !== null) {
        masterVolume = savedVolume / 100;
    }
} catch (e) {  }

function clampVolume(level) {
    return Math.min(Math.max(level, 0), 1);
}

var fadeGeneration = 0;

function fadeInAudio() {
    var mine = ++fadeGeneration;
    var start = performance.now();

    function step(now) {
        if (mine !== fadeGeneration) return;
        var progress = Math.min((now - start) / FADE_IN_MS, 1);
        bgAudio.volume = clampVolume(masterVolume * progress);
        if (progress < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
    setTimeout(function () {
        if (mine === fadeGeneration) bgAudio.volume = clampVolume(masterVolume);
    }, FADE_IN_MS + 250);
}

function resumeAudio() {
    if (!bgAudio.paused || masterVolume === 0) return;
    bgAudio.volume = 0;
    bgAudio.play().then(fadeInAudio).catch(function () {  });
}

// click sound
function playClick() {
    uiClick.currentTime = 0;
    uiClick.volume = clampVolume(masterVolume * 0.35);
    uiClick.play().catch(function () {  });
}

document.addEventListener("click", function (e) {
    if (e.target.closest(".camNode, .backBtn")) playClick();
});

// volume
var volumeSlider = document.getElementById("masterVolume");
var volumeValue = document.getElementById("volumeValue");

function syncVolumeDisplay() {
    volumeValue.textContent = Math.round(masterVolume * 100) + "%";
}

volumeSlider.value = String(Math.round(masterVolume * 100));
syncVolumeDisplay();

volumeSlider.addEventListener("input", function () {
    masterVolume = Number(volumeSlider.value) / 100;
    try { localStorage.setItem("zoneoutVolume", volumeSlider.value); } catch (e) {  }

    fadeGeneration++;
    bgAudio.volume = clampVolume(masterVolume);
    syncVolumeDisplay();

    resumeAudio();
});

resumeAudio();
bgAudio.addEventListener("canplay", resumeAudio);

var videoBG = document.getElementById("videoBG");

// nothing decodes for a hidden tab
document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
        var playing = videoBG.play();
        if (playing && playing.catch) playing.catch(function () {});
    } else {
        videoBG.pause();
    }
});

</script>

<script src="/settings.js" defer></script>
