<script>
// theme, read before the first paint
try {
    var zoTheme = localStorage.getItem("zoneoutTheme");
    if (zoTheme && zoTheme !== "default" && /^[a-z0-9-]{1,24}$/.test(zoTheme)) {
        document.documentElement.setAttribute("data-theme", zoTheme);
        var zoMeta = document.querySelector('meta[name="theme-color"]');
        if (zoMeta) zoMeta.content = { bw: "#0a0a0a", fnaf: "#000000", halloween: "#080402" }[zoTheme] || "#000000";
    }
} catch (e) {}
</script>
<title>ZoneOut Project</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">

<script>
// id, request and tab stash, read before the first paint
(function () {
    var match = location.pathname.match(/\/projects\/(\d+)\/?$/);
    window.__projectId = match ? match[1] : null;

    if (window.__projectId) {
        window.__projectPromise =
            fetch("/api/projects/" + window.__projectId, { credentials: "same-origin" });
        window.__projectPromise.catch(function () {  });
    }

    window.__projectSeed = null;
    try {
        var cached = JSON.parse(sessionStorage.getItem("zoneoutProjects") || "null");
        if (cached && Array.isArray(cached.list)) {
            for (var i = 0; i < cached.list.length; i++) {
                if (String(cached.list[i].projectId) === window.__projectId) {
                    window.__projectSeed = Object.assign({}, cached.list[i], {
                        ownerName: cached.list[i].ownerName || cached.userName || null
                    });
                    break;
                }
            }
        }
    } catch (e) {  }
})();
</script>

<style>

<script>

// state
var projectId = window.__projectId;
var project = null;
var canEdit = false;
var isAdmin = false;
var signedIn = true;

// views
function show(id) {
    var states = document.querySelectorAll(".state");
    for (var i = 0; i < states.length; i++) states[i].classList.remove("show");
    document.getElementById(id).classList.add("show");

    document.documentElement.dataset.gear = id === "stateMissing" ? "off" : "on";
}

function missing(message) {
    if (message) document.getElementById("missingText").textContent = message;
    show("stateMissing");
}

// thumbnail sizing
function thumbFontSize(name, boxPx) {
    var text = (name || "").trim();
    var length = text.length;

    var byLines = 12;
    if (length <= 4) byLines = 34;
    else if (length <= 8) byLines = 26;
    else if (length <= 14) byLines = 20;
    else if (length <= 24) byLines = 16;
    else if (length <= 40) byLines = 14;

    var longest = text.split(/\s+/).reduce(function (max, word) {
        return Math.max(max, word.length);
    }, 1);
    var byWidth = Math.floor(boxPx / (longest * 0.6 + 1));

    return Math.max(9, Math.min(byLines, byWidth));
}

function paintThumb(el, name) {
    el.textContent = name;
    var width = el.getBoundingClientRect().width;

    el.style.fontSize = thumbFontSize(name, (width > 40 ? width : 96) - 20) + "px";
}

// hackatime
var editHtField = document.getElementById("editHtField");
var editHtWrap = document.getElementById("editHtWrap");
var editHtBtn = document.getElementById("editHtBtn");
var editHtMenu = document.getElementById("editHtMenu");
var editHtNote = document.getElementById("editHtNote");

var NO_LINK_LABEL = "— none —";

var htChoice = null;
var htList = null;
var htListPending = false;

function hoursLine() {
    var box = document.getElementById("viewHours");
    var linked = project && project.hackatimeProject;

    box.hidden = !linked;
    if (!linked) return;

    var hours = Number(project.hackatimeHours) || 0;
    document.getElementById("viewHoursValue").textContent = hours + " ACTIVE HOURS";
}

function setHtChoice(name) {
    htChoice = name || null;
    editHtBtn.textContent = htChoice || NO_LINK_LABEL;
    editHtBtn.dataset.empty = htChoice ? "false" : "true";
}

function showHtNote(message, withLink) {
    editHtWrap.hidden = true;
    editHtNote.hidden = false;
    editHtNote.replaceChildren();
    editHtNote.appendChild(document.createTextNode(message));

    if (withLink) {
        editHtNote.appendChild(document.createTextNode(" "));
        var link = document.createElement("a");
        link.href = "/api/hackatime/login";
        link.textContent = "Connect Hackatime";
        editHtNote.appendChild(link);
        editHtNote.appendChild(document.createTextNode("."));
    }
}

function buildHtMenu() {
    editHtMenu.replaceChildren();

    var entries = [{ name: null, hours: null }].concat(htList || []);

    entries.forEach(function (entry) {
        var option = document.createElement("button");
        option.className = "htOption";
        option.type = "button";
        option.setAttribute("role", "option");
        option.setAttribute("aria-selected", String((entry.name || null) === htChoice));
        option.textContent = entry.name || NO_LINK_LABEL;

        if (entry.name) {
            var hours = document.createElement("span");
            hours.className = "htHours";
            hours.textContent = "  " + entry.hours + "h";
            option.appendChild(hours);
        }

        // one hackatime project belongs to one zoneout project, this one excepted
        if (entry.linkedTo && entry.linkedTo.projectId !== (project && project.projectId)) {
            var taken = document.createElement("span");
            taken.className = "htTaken";
            taken.textContent = "  (linked to different project)";
            option.appendChild(taken);
            option.disabled = true;
            option.title = "Already linked to " + entry.linkedTo.name;
        } else {
            option.addEventListener("click", function () {
                setHtChoice(entry.name);
                closeHtMenu(true);
            });
        }

        editHtMenu.appendChild(option);
    });
}

function openHtMenu() {
    buildHtMenu();
    editHtMenu.hidden = false;
    editHtBtn.setAttribute("aria-expanded", "true");

    var first = editHtMenu.querySelector('[aria-selected="true"]') || editHtMenu.firstElementChild;
    if (first) first.focus();
}

function closeHtMenu(refocus) {
    if (editHtMenu.hidden) return;
    editHtMenu.hidden = true;
    editHtBtn.setAttribute("aria-expanded", "false");
    if (refocus) editHtBtn.focus();
}

function htMenuOpen() {
    return !editHtMenu.hidden;
}

editHtBtn.addEventListener("click", function () {
    if (editHtMenu.hidden) openHtMenu();
    else closeHtMenu(true);
});

document.addEventListener("mousedown", function (e) {
    if (editHtMenu.hidden) return;
    if (e.target.closest(".htWrap")) return;
    closeHtMenu(false);
});

// an administrator editing somebody else has no list to offer, and must not reassign the link
function loadHackatimeProjects() {
    if (isAdmin) {
        editHtField.hidden = true;
        return;
    }

    editHtField.hidden = false;
    editHtNote.hidden = true;
    editHtWrap.hidden = false;

    if (htList || htListPending) return;
    htListPending = true;

    fetch("/api/hackatime/projects", { credentials: "same-origin" })
        .then(function (response) { return response.ok ? response.json() : null; })
        .then(function (payload) {
            htListPending = false;
            if (!payload || !payload.ok) return;

            if (!payload.linked) {
                showHtNote("Your Hackatime account is not connected.", true);
                return;
            }

            htList = payload.projects || [];
            if (!htList.length) {
                showHtNote("No Hackatime projects have time logged since the event started.", false);
                return;
            }
            if (!editHtMenu.hidden) buildHtMenu();
        })
        .catch(function () { htListPending = false; });
}

// owner line
function ownerLine() {
    var name = (project && project.ownerName || "").trim();
    return name ? "MADE BY " + name : "";
}

// rendering
function renderView() {
    document.title = project.name + " · ZoneOut";

    paintThumb(document.getElementById("viewThumb"), project.name);
    document.getElementById("viewTitle").textContent = project.name;
    document.getElementById("viewId").textContent = ownerLine();
    hoursLine();
    document.getElementById("viewDescription").textContent = project.description;

    var links = document.getElementById("viewLinks");
    links.textContent = "";

    addLink(links, "REPOSITORY", project.repoUrl);
    addLink(links, "LIVE DEMO", project.demoUrl);

    if (!links.children.length) {
        var none = document.createElement("div");
        none.className = "noLinks";
        none.textContent = "No links provided.";
        links.appendChild(none);
    }

    document.getElementById("ownerRow").hidden = !canEdit;
    document.getElementById("adminNote").hidden = !isAdmin;
    show("stateView");
    focusFirstControl();
}

function addLink(container, label, url) {
    if (!url) return;

    var a = document.createElement("a");
    a.className = "projectLink";
    a.href = url;
    a.textContent = label;

    a.target = "_blank";
    a.rel = "noopener noreferrer nofollow";
    container.appendChild(a);
}

// editor
function openEditor() {
    if (!project || !canEdit) return;

    paintThumb(document.getElementById("editThumb"), project.name);
    document.getElementById("editId").textContent = ownerLine();

    document.getElementById("editName").value = project.name;
    document.getElementById("editDescription").value = project.description;
    document.getElementById("editRepo").value = project.repoUrl || "";
    document.getElementById("editDemo").value = project.demoUrl || "";
    document.getElementById("editError").textContent = "";

    setHtChoice(project.hackatimeProject || null);
    loadHackatimeProjects();

    show("stateEdit");
    document.getElementById("editName").focus();
}

// load
function load() {
    if (!projectId) {
        missing();
        return;
    }

    if (window.__projectSeed) {
        project = window.__projectSeed;
        canEdit = false;
        renderView();
    }

    window.__projectPromise
        .then(function (response) {
            if (response.status === 404) return null;
            if (!response.ok) throw new Error("unreachable");
            return response.json();
        })
        .then(function (payload) {
            if (!payload) { missing(); return; }
            project = payload.project;
            canEdit = Boolean(payload.canEdit);
            isAdmin = Boolean(payload.isAdmin);
            if (payload.signedIn === false) showLoginBar();
            renderView();
        })
        .catch(function () {
            missing("This terminal could not reach ZoneOut.");
        });
}

// edit controls
document.getElementById("editBtn").addEventListener("click", openEditor);

document.getElementById("cancelBtn").addEventListener("click", function () {
    renderView();
});

document.getElementById("editForm").addEventListener("submit", function (e) {
    e.preventDefault();

    var saveBtn = document.getElementById("saveBtn");
    var errorEl = document.getElementById("editError");

    var body = {
        name: document.getElementById("editName").value,
        description: document.getElementById("editDescription").value,
        repoUrl: document.getElementById("editRepo").value,
        demoUrl: document.getElementById("editDemo").value
    };

    if (!isAdmin) body.hackatimeProject = htChoice;

    if (!body.name.trim() || !body.description.trim()) {
        errorEl.textContent = "A project needs a name and a description.";
        return;
    }

    errorEl.textContent = "";
    saveBtn.disabled = true;
    saveBtn.textContent = "SAVING…";

    fetch("/api/projects/" + projectId, {
        method: "PATCH",
        credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    })
        .then(function (response) {
            if (response.status === 403) { window.location.replace("/ban"); return null; }
            return response.json().then(function (payload) {
                return { ok: response.ok, status: response.status, payload: payload };
            });
        })
        .then(function (result) {
            if (!result) return;

            if (!result.ok) {
                if (result.status === 404) {
                    missing("You cannot edit this project.");
                    return;
                }
                errorEl.textContent = result.payload.error || "Could not save.";
                return;
            }

            project = result.payload.project;
            canEdit = true;
            renderView();
            stashEdit(project);
        })
        .catch(function () {
            errorEl.textContent = "Could not reach ZoneOut.";
        })
        .then(function () {
            saveBtn.disabled = false;
            saveBtn.textContent = "SAVE CHANGES";
        });
});

// keep this tab's project list in step
function stashEdit(saved) {
    try {
        var cached = JSON.parse(sessionStorage.getItem("zoneoutProjects") || "null");
        if (!cached || !Array.isArray(cached.list)) return;

        for (var i = 0; i < cached.list.length; i++) {
            if (cached.list[i].projectId === saved.projectId) {
                cached.list[i] = saved;
                sessionStorage.setItem("zoneoutProjects", JSON.stringify(cached));
                return;
            }
        }
    } catch (e) {  }
}

// back control
function cameFromThisSite() {
    if (!document.referrer) return false;
    try {
        return new URL(document.referrer).origin === location.origin;
    } catch (e) {
        return false;
    }
}

function goBack() {
    if (document.getElementById("stateEdit").classList.contains("show")) {
        renderView();
        return;
    }

    if (!signedIn) {
        window.location.href = "/";
        return;
    }

    if (cameFromThisSite() && history.length > 1) {
        history.back();
        return;
    }
    window.location.href = "/projects";
}

var backBtn = document.getElementById("backBtn");
backBtn.addEventListener("click", goBack);

// signed-out bar
var loginBar = document.getElementById("loginBar");

function measureLoginBar() {
    if (loginBar.hidden) return;
    document.body.style.setProperty("--loginBarH", loginBar.offsetHeight + "px");
}

function showLoginBar() {
    signedIn = false;
    if (!loginBar.hidden) return;
    loginBar.hidden = false;
    backBtn.hidden = true;
    document.body.classList.add("hasLoginBar");
    measureLoginBar();
}

window.addEventListener("resize", measureLoginBar);

backBtn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        goBack();
    }
});

// keyboard controls
function isTyping() {
    var active = document.activeElement;
    if (!active) return false;
    var tag = active.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
}

function controls() {
    var list = [];

    if (window.zoneoutSettings && window.zoneoutSettings.isOpen()) return list;

    if (deleteModalOpen()) {
        var inModal = deleteModal.querySelectorAll("button");
        for (var i = 0; i < inModal.length; i++) {
            if (!inModal[i].disabled) list.push(inModal[i]);
        }
        return list;
    }

    if (!backBtn.hidden) list.push(backBtn);

    var view = document.querySelector(".state.show");
    if (view) {
        var found = view.querySelectorAll("button, a.projectLink");
        for (var j = 0; j < found.length; j++) {
            if (!found[j].disabled && found[j].getClientRects().length > 0) list.push(found[j]);
        }
    }

    var gear = document.getElementById("settingsGear");
    if (gear && document.documentElement.getAttribute("data-gear") === "on") list.push(gear);

    return list;
}

function htOptions() {
    var options = [];
    var kids = editHtMenu.children;

    for (var i = 0; i < kids.length; i++) {
        if (!kids[i].disabled) options.push(kids[i]);
    }

    return options;
}

function stepHtMenu(delta) {
    var options = htOptions();
    if (!options.length) return;

    var at = options.indexOf(document.activeElement);
    var next = at === -1
        ? (delta > 0 ? 0 : options.length - 1)
        : (at + delta + options.length) % options.length;

    options[next].focus();
}

function jumpHtMenu(last) {
    var options = htOptions();
    if (!options.length) return;
    options[last ? options.length - 1 : 0].focus();
}

function stepFocus(delta) {
    var list = controls();
    if (!list.length) return;

    var at = list.indexOf(document.activeElement);
    var next = at === -1
        ? (delta > 0 ? 0 : list.length - 1)
        : (at + delta + list.length) % list.length;

    list[next].focus();
}

function focusEnd(last) {
    var list = controls();
    if (!list.length) return;
    list[last ? list.length - 1 : 0].focus();
}

function focusFirstControl() {
    if (!lastInputWasKeyboard) return;
    focusEnd(false);
}

document.addEventListener("keydown", function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) return;

    if (htMenuOpen()) {
        if (e.key === "Escape") {
            e.preventDefault();
            closeHtMenu(true);
        } else if (e.key === "ArrowDown" || e.key === "ArrowRight") {
            e.preventDefault();
            stepHtMenu(1);
        } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
            e.preventDefault();
            stepHtMenu(-1);
        } else if (e.key === "Home") {
            e.preventDefault();
            jumpHtMenu(false);
        } else if (e.key === "End") {
            e.preventDefault();
            jumpHtMenu(true);
        }
        return;
    }

    if (document.activeElement === editHtBtn && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
        e.preventDefault();
        openHtMenu();
        return;
    }

    if (e.key === "Escape") {
        if (deleteModalOpen()) {
            closeDeleteModal();
            return;
        }
        if (isTyping()) return;
        goBack();
        return;
    }

    if (isTyping()) return;

    if (e.key === "ArrowDown" || e.key === "ArrowRight") {
        e.preventDefault();
        stepFocus(1);
    } else if (e.key === "ArrowUp" || e.key === "ArrowLeft") {
        e.preventDefault();
        stepFocus(-1);
    } else if (e.key === "Home") {
        e.preventDefault();
        focusEnd(false);
    } else if (e.key === "End") {
        e.preventDefault();
        focusEnd(true);
    }
});

document.getElementById("toMenuBtn").addEventListener("click", function () {
    window.location.href = "/";
});

load();

// delete
var deleteModal = document.getElementById("deleteModal");
var deleteConfirm = document.getElementById("deleteConfirm");
var deleteError = document.getElementById("deleteError");
var deleteReturnFocus = null;

function deleteModalOpen() {
    return deleteModal.classList.contains("show");
}

function setInertBehind(on) {
    var children = document.body.children;
    for (var i = 0; i < children.length; i++) {
        if (children[i] !== deleteModal && children[i].tagName !== "SCRIPT") {
            children[i].inert = on;
        }
    }
}

function openDeleteModal() {
    if (!project || !canEdit) return;

    deleteReturnFocus = document.activeElement;

    document.getElementById("deleteModalText").textContent =
        "“" + project.name + "” will be erased for good. This cannot be undone.";

    deleteError.textContent = "";
    deleteConfirm.disabled = false;
    deleteConfirm.textContent = "DELETE FOREVER";

    deleteModal.hidden = false;
    requestAnimationFrame(function () { deleteModal.classList.add("show"); });

    document.body.classList.add("noScroll");
    setInertBehind(true);

    document.getElementById("deleteCancel").focus();
}

function closeDeleteModal() {
    deleteModal.classList.remove("show");
    setInertBehind(false);
    document.body.classList.remove("noScroll");

    setTimeout(function () {
        if (!deleteModalOpen()) deleteModal.hidden = true;
    }, 240);

    if (deleteReturnFocus && document.contains(deleteReturnFocus)) deleteReturnFocus.focus();
    deleteReturnFocus = null;
}

document.getElementById("deleteBtn").addEventListener("click", openDeleteModal);
document.getElementById("deleteCancel").addEventListener("click", closeDeleteModal);
document.getElementById("deleteModalClose").addEventListener("click", closeDeleteModal);

deleteModal.addEventListener("mousedown", function (e) {
    if (e.target === deleteModal) closeDeleteModal();
});

deleteConfirm.addEventListener("click", function () {
    deleteError.textContent = "";
    deleteConfirm.disabled = true;
    deleteConfirm.textContent = "DELETING…";

    fetch("/api/projects/" + projectId, {
        method: "DELETE",
        credentials: "same-origin"
    })
        .then(function (response) {
            if (response.status === 403) { window.location.replace("/ban"); return null; }
            if (response.ok) return { ok: true };
            return response.json()
                .catch(function () { return {}; })
                .then(function (payload) {
                    return { ok: false, status: response.status, payload: payload };
                });
        })
        .then(function (result) {
            if (!result) return;

            if (!result.ok) {
                if (result.status === 404 || result.status === 401) {
                    closeDeleteModal();
                    missing("You cannot delete this project.");
                    return;
                }
                deleteError.textContent = result.payload.error || "Could not delete.";
                deleteConfirm.disabled = false;
                deleteConfirm.textContent = "DELETE FOREVER";
                return;
            }

            stashRemove(projectId);
            window.location.replace("/projects");
        })
        .catch(function () {
            deleteError.textContent = "Could not reach ZoneOut.";
            deleteConfirm.disabled = false;
            deleteConfirm.textContent = "DELETE FOREVER";
        });
});

function stashRemove(removedId) {
    try {
        var cached = JSON.parse(sessionStorage.getItem("zoneoutProjects") || "null");
        if (!cached || !Array.isArray(cached.list)) return;

        cached.list = cached.list.filter(function (entry) {
            return String(entry.projectId) !== String(removedId);
        });
        sessionStorage.setItem("zoneoutProjects", JSON.stringify(cached));
    } catch (e) {  }
}

// gestures
var lastInputWasKeyboard = false;

["pointerdown", "touchstart", "keydown"].forEach(function (evt) {
    document.addEventListener(evt, function () {
        lastInputWasKeyboard = evt === "keydown";
        resumeAudio();
    }, true);
});

// audio
var bgAudio = document.getElementById("bgAudio");
var uiClick = document.getElementById("uiClick");
var FADE_IN_MS = 1600;

var masterVolume = 0.35;
try {
    var savedVolume = Number(localStorage.getItem("zoneoutVolume"));
    if (Number.isFinite(savedVolume) && savedVolume >= 0 && savedVolume <= 100
        && localStorage.getItem("zoneoutVolume") !== null) {
        masterVolume = savedVolume / 100;
    }
} catch (e) {  }

function clampVolume(level) {
    return Math.min(Math.max(level, 0), 1);
}

var fadeGeneration = 0;

function fadeInAudio() {
    var mine = ++fadeGeneration;
    var start = performance.now();

    function step(now) {
        if (mine !== fadeGeneration) return;
        var progress = Math.min((now - start) / FADE_IN_MS, 1);
        bgAudio.volume = clampVolume(masterVolume * progress);
        if (progress < 1) requestAnimationFrame(step);
    }

    requestAnimationFrame(step);
    setTimeout(function () {
        if (mine === fadeGeneration) bgAudio.volume = clampVolume(masterVolume);
    }, FADE_IN_MS + 250);
}

function resumeAudio() {
    if (!bgAudio.paused || masterVolume === 0) return;
    bgAudio.volume = 0;
    bgAudio.play().then(fadeInAudio).catch(function () {  });
}

// click sound
function playClick() {
    uiClick.currentTime = 0;
    uiClick.volume = clampVolume(masterVolume * 0.35);
    uiClick.play().catch(function () {  });
}

document.addEventListener("click", function (e) {
    if (e.target.closest(".camNode, .backBtn, .modalClose, .projectLink")) playClick();
});

backBtn.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") playClick();
});

// volume
var volumeSlider = document.getElementById("masterVolume");
var volumeValue = document.getElementById("volumeValue");

function syncVolumeDisplay() {
    volumeValue.textContent = Math.round(masterVolume * 100) + "%";
}

volumeSlider.value = String(Math.round(masterVolume * 100));
syncVolumeDisplay();

volumeSlider.addEventListener("input", function () {
    masterVolume = Number(volumeSlider.value) / 100;
    try { localStorage.setItem("zoneoutVolume", volumeSlider.value); } catch (e) {  }

    fadeGeneration++;
    bgAudio.volume = clampVolume(masterVolume);
    syncVolumeDisplay();

    resumeAudio();
});

resumeAudio();
bgAudio.addEventListener("canplay", resumeAudio);

var videoBG = document.getElementById("videoBG");

// nothing decodes for a hidden tab
document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
        var playing = videoBG.play();
        if (playing && playing.catch) playing.catch(function () {});
    } else {
        videoBG.pause();
    }
});

</script>
